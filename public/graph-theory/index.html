  const difficultyLabels = { starter: 'Starter', intermediate: 'Intermediate', challenge: 'Challenge' };
  const paragraphHTML = value => String(value ?? '').split(/\n\s*\n/).filter(Boolean).map(part => `<p>${esc(part)}</p>`).join('');
  const readStorage = () => {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return value && typeof value === 'object' && !Array.isArray(value) && value.sections && typeof value.sections === 'object' && !Array.isArray(value.sections) ? value : { version: 1, sections: {} };
    } catch { return { version: 1, sections: {} }; }
  };
  function questionsFor(sectionId) {
    const section = window.CHAPTER_DATA?.sections?.find(item => item.id === sectionId);
    const questions = Array.isArray(window.QUIZ_BANK?.[sectionId]) ? window.QUIZ_BANK[sectionId].slice() : [];
    if (section?.challenge) {
      const challenge = section.challenge;
      questions.unshift({
        id: `${sectionId}-original`, type: 'choice', difficulty: 'starter', title: 'Quick check',
        prompt: challenge.question, options: challenge.options,
        answer: typeof challenge.answer === 'number' ? challenge.answer : challenge.options.indexOf(challenge.answer),
        explanation: challenge.explanation, topic: section.title, hints: []
      });
    }
    return questions;
  }
  function attemptFor(record, question) {
    if (!record.attempts || typeof record.attempts !== 'object' || Array.isArray(record.attempts)) record.attempts = {};
    let attempt = record.attempts[question.id];
    if (!attempt || typeof attempt !== 'object' || Array.isArray(attempt)) attempt = record.attempts[question.id] = {};
    if (!['solved', 'reviewed'].includes(attempt.status)) attempt.status = null;
    attempt.hintsShown = Math.max(0, Math.min((question.hints || []).length, Number(attempt.hintsShown) || 0));
    attempt.revealed = Boolean(attempt.revealed);
    if (!Array.isArray(attempt.rubric)) attempt.rubric = [];
    return attempt;
  }
  function countStats(sectionId, storage = readStorage()) {
    const sections = sectionId ? [sectionId] : (window.CHAPTER_DATA?.sections || []).map(section => section.id);
    const stats = { total: 0, solved: 0, reviewed: 0, attempted: 0, types: { choice: 0, number: 0, graph: 0, proof: 0 } };
    for (const sid of sections) for (const question of questionsFor(sid)) {
      stats.total++;
      if (Object.prototype.hasOwnProperty.call(stats.types, question.type)) stats.types[question.type]++;
      const attempt = storage.sections?.[sid]?.attempts?.[question.id];
      if (attempt?.status === 'solved') stats.solved++;
      else if (attempt?.status === 'reviewed') stats.reviewed++;
      if (attempt && (Number.isInteger(attempt.choice) || attempt.number || attempt.draft || attempt.graphState || attempt.status || attempt.hintsShown)) stats.attempted++;
    }
    return stats;
  }
  function parseNumber(value) {
    const input = String(value ?? '').trim().replace(/−/g, '-');
    const numeric = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i;
    if (numeric.test(input)) return Number(input);
    const parts = input.split('/').map(part => part.trim());
    if (parts.length === 2 && parts.every(part => numeric.test(part)) && Number(parts[1]) !== 0) return Number(parts[0]) / Number(parts[1]);
    return NaN;
  }

  class QuestionBank {
    constructor(container, sectionId) {
      this.container = container;
      this.sectionId = sectionId;
      this.questions = questionsFor(sectionId);
      this.storage = readStorage();
      const saved = this.storage.sections[sectionId];
      this.record = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : { attempts: {} };
      this.storage.sections[sectionId] = this.record;
      if (!['all', 'quick', 'graph', 'proof'].includes(this.record.typeFilter)) this.record.typeFilter = 'all';
      if (!['all', 'starter', 'intermediate', 'challenge'].includes(this.record.difficultyFilter)) this.record.difficultyFilter = 'all';
      this.questions.forEach(question => attemptFor(this.record, question));
      this.graph = null;
      this.destroyed = false;
      if (!this.questions.some(question => question.id === this.record.current)) this.record.current = this.questions[0]?.id;
      this.ensureCurrent();
      this.render();
    }
    static getStats(sectionId) { return countStats(sectionId); }
    getStats() { return countStats(this.sectionId, this.storage); }
    get current() { return this.questions.find(question => question.id === this.record.current); }
    get filtered() {
      return this.questions.filter(question =>
        (this.record.typeFilter === 'all' || (this.record.typeFilter === 'quick' ? ['choice', 'number'].includes(question.type) : question.type === this.record.typeFilter)) &&
        (this.record.difficultyFilter === 'all' || question.difficulty === this.record.difficultyFilter)
      );
    }
    ensureCurrent() {
      if (!this.filtered.some(question => question.id === this.record.current)) this.record.current = this.filtered[0]?.id;
    }
    save() {
      if (this.destroyed) return;
      // Merge other sections so progress from a second open lesson is retained.
      const storage = readStorage();
      storage.version = 1;
      storage.sections[this.sectionId] = this.record;
      this.storage = storage;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(storage)); } catch { /* Practice still works when browser storage is unavailable. */ }
    }
    saveGraph() {
      if (this.graph && this.current) {
        try { attemptFor(this.record, this.current).graphState = this.graph.getState(); } catch { /* A graph view can be removed during navigation. */ }
      }
    }
    destroyGraph() {
      this.saveGraph();
      if (this.graph) { this.graph.destroy(); this.graph = null; }
    }
    render() {
      this.destroyGraph();
      const globalStats = countStats();
      this.container.innerHTML = `<section class="question-bank" aria-labelledby="practice-title-${esc(this.sectionId)}">
        <div class="practice-heading"><div><p class="practice-eyebrow">PRACTICE &amp; DISCOVERY</p><h2 id="practice-title-${esc(this.sectionId)}" tabindex="-1">Put the ideas to work.</h2><p class="practice-subtitle">${this.questions.length} questions in this section · ${globalStats.total} across the chapter. Start small, experiment, then build a proof.</p></div><div class="practice-progress" aria-live="polite"></div></div>
        <div class="practice-filters"><label class="practice-filter">Question type<select data-type-filter><option value="all">All types</option><option value="quick">Quick checks</option><option value="graph">Graph tasks</option><option value="proof">Proofs</option></select></label><label class="practice-filter">Difficulty<select data-difficulty-filter><option value="all">All levels</option><option value="starter">Starter</option><option value="intermediate">Intermediate</option><option value="challenge">Challenge</option></select></label><p class="practice-filter-count"></p></div>
        <nav class="question-index" aria-label="Choose a practice question"></nav><div class="question-card-host"></div>
        <p class="question-help practice-storage-note">Answers, graph edits, and proof drafts are saved in this browser. Solved means checked without revealing the answer; reviewed includes shown solutions and self-assessed proofs.</p>
      </section>`;
      const type = this.container.querySelector('[data-type-filter]');
      const difficulty = this.container.querySelector('[data-difficulty-filter]');
      type.value = this.record.typeFilter;
      difficulty.value = this.record.difficultyFilter;
      type.addEventListener('change', () => { this.changeFilter('typeFilter', type.value); });
      difficulty.addEventListener('change', () => { this.changeFilter('difficultyFilter', difficulty.value); });
      this.updateProgress();
      this.renderIndex();
      this.renderCard();
    }
    changeFilter(key, value) {
      this.destroyGraph();
      this.record[key] = value;
      this.ensureCurrent();
      this.save();
      this.renderIndex();
      this.renderCard();
    }
    updateProgress() {
      const stats = this.getStats();
      const progress = this.container.querySelector('.practice-progress');
      if (progress) progress.innerHTML = `<strong>${stats.solved + stats.reviewed}<span> / ${stats.total}</span></strong><small>${stats.solved} solved · ${stats.reviewed} reviewed</small>`;
      this.container.dispatchEvent(new CustomEvent('questionprogress', { bubbles: true, detail: { sectionId: this.sectionId, ...stats } }));
    }
    renderIndex() {
      const visible = this.filtered;
      const index = this.container.querySelector('.question-index');
      index.innerHTML = visible.map(question => {
        const number = this.questions.indexOf(question) + 1;
        const status = attemptFor(this.record, question).status;
        return `<button type="button" class="question-index-button ${question.id === this.record.current ? 'active' : ''} ${status || 'unanswered'}" data-question-id="${esc(question.id)}" ${question.id === this.record.current ? 'aria-current="true"' : ''} aria-label="Question ${number}: ${esc(question.title)}, ${status || 'not completed'}" title="${esc(question.title)}"><span>${number}</span><span class="status-dot" aria-hidden="true">${status === 'solved' ? '✓' : status === 'reviewed' ? '◐' : '·'}</span></button>`;
      }).join('');
      index.querySelectorAll('[data-question-id]').forEach(button => button.addEventListener('click', () => this.selectQuestion(button.dataset.questionId, true)));
      this.container.querySelector('.practice-filter-count').textContent = `${visible.length} of ${this.questions.length} shown`;
    }
    goToQuestion(id) {
      if (!this.questions.some(question => question.id === id)) return false;
      this.destroyGraph();
      if (!this.filtered.some(question => question.id === id)) { this.record.typeFilter = 'all'; this.record.difficultyFilter = 'all'; }
      this.record.current = id;
      this.save();
      this.render();
      return true;
    }
    selectQuestion(id, focus = false) {
      if (id === this.record.current) return;
      this.destroyGraph();
      this.record.current = id;
      this.save();
      this.renderIndex();
      this.renderCard();
      if (focus) this.container.querySelector('.question-card h3')?.focus({ preventScroll: true });
    }
    renderCard() {
      this.destroyGraph();
      const host = this.container.querySelector('.question-card-host');
      const question = this.current;
      if (!question) { host.innerHTML = '<div class="question-empty"><p>No questions match these filters. Choose another type or difficulty.</p><button type="button" class="text-button" data-clear-filters>Show all questions</button></div>'; host.querySelector('[data-clear-filters]').addEventListener('click', () => { this.record.typeFilter = 'all'; this.record.difficultyFilter = 'all'; this.ensureCurrent(); this.save(); this.render(); }); return; }
      const attempt = attemptFor(this.record, question);
      const number = this.questions.indexOf(question) + 1;
      const visibleIndex = this.filtered.indexOf(question);
      host.innerHTML = `<article class="question-card" aria-labelledby="question-title-${esc(question.id)}">
        <div class="question-meta"><span class="question-type ${esc(question.type)}">${esc(labels[question.type] || question.type)}</span><span class="question-difficulty ${esc(question.difficulty)}">${esc(difficultyLabels[question.difficulty] || question.difficulty)}</span><span class="question-topic">${esc(question.topic || '')}</span><span class="question-state">${attempt.status === 'solved' ? '✓ Solved' : attempt.status === 'reviewed' ? '◐ Reviewed' : ''}</span></div>
        <h3 id="question-title-${esc(question.id)}" tabindex="-1"><span class="question-number">${String(number).padStart(2, '0')}.</span> ${esc(question.title)}</h3><div class="question-prompt">${paragraphHTML(question.prompt)}</div>
        ${this.answerHTML(question, attempt)}
        <div class="question-hints" aria-live="polite">${this.hintsHTML(question, attempt)}</div>
        <div class="question-actions">${question.type !== 'proof' ? '<button type="button" class="question-check" data-check>Check answer <span aria-hidden="true">→</span></button>' : ''}${(question.hints || []).length ? `<button type="button" class="text-button question-hint-button" data-hint ${attempt.hintsShown >= question.hints.length ? 'disabled' : ''}>${attempt.hintsShown ? 'Next hint' : 'Get a hint'} (${attempt.hintsShown}/${question.hints.length})</button>` : ''}<button type="button" class="text-button question-solution-button" data-solution ${attempt.revealed ? 'aria-expanded="true"' : 'aria-expanded="false"'}>${question.type === 'proof' ? 'Compare your proof' : 'Show solution'}</button><button type="button" class="text-button question-reset" data-reset>Reset this attempt</button></div>
        <div class="question-feedback" role="status" aria-live="polite"></div>
        <div class="question-solution" ${attempt.revealed ? '' : 'hidden'}></div>
        <nav class="question-navigation" aria-label="Move between practice questions"><button type="button" class="text-button" data-previous ${visibleIndex <= 0 ? 'disabled' : ''}><span aria-hidden="true">←</span> Previous</button><span>Question ${number} of ${this.questions.length}${this.filtered.length !== this.questions.length ? ` · ${visibleIndex + 1} of ${this.filtered.length} filtered` : ''}</span><button type="button" class="text-button" data-next ${visibleIndex >= this.filtered.length - 1 ? 'disabled' : ''}>Next <span aria-hidden="true">→</span></button></nav>
      </article>`;
      if (question.type === 'choice') host.querySelectorAll('input[name="question-answer"]').forEach(input => input.addEventListener('change', () => { attempt.choice = Number(input.value); this.clearFeedback(); this.save(); }));
      if (question.type === 'number') host.querySelector('[data-number-answer]').addEventListener('input', event => { attempt.number = event.target.value; this.clearFeedback(); this.save(); });
      if (question.type === 'proof') {
        const textarea = host.querySelector('[data-proof-draft]');
        textarea.value = typeof attempt.draft === 'string' ? attempt.draft : '';
        textarea.addEventListener('input', event => { attempt.draft = event.target.value; this.save(); });
      }
      if (question.type === 'graph') {
        const graphHost = host.querySelector('[data-question-graph]');
        if (window.QuizGraphTask) {
          this.graph = new window.QuizGraphTask(graphHost, question.graphTask, (state, metadata) => { if (this.graph) { this.saveGraph(); if (metadata?.semantic !== false) this.clearFeedback(); this.save(); } });
          if (attempt.graphState) this.graph.applyState(attempt.graphState);
        } else graphHost.textContent = 'The graph task could not load. You can still use its hints and worked solution.';
      }
      host.querySelector('[data-check]')?.addEventListener('click', () => this.checkAnswer());
      host.querySelector('[data-hint]')?.addEventListener('click', () => this.showHint());
      host.querySelector('[data-solution]').addEventListener('click', () => this.showSolution(true));
      host.querySelector('[data-reset]').addEventListener('click', () => this.resetAttempt());
      host.querySelector('[data-previous]').addEventListener('click', () => this.selectQuestion(this.filtered[visibleIndex - 1]?.id, true));
      host.querySelector('[data-next]').addEventListener('click', () => this.selectQuestion(this.filtered[visibleIndex + 1]?.id, true));
      this.renderFeedback();
      if (attempt.revealed) this.renderSolution();
    }
    answerHTML(question, attempt) {
      if (question.type === 'choice') return `<fieldset class="question-options"><legend class="visually-hidden">Choose one answer</legend>${(question.options || []).map((option, index) => `<label class="question-option"><input type="radio" name="question-answer" value="${index}" ${attempt.choice === index ? 'checked' : ''}><span class="option-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${esc(option)}</span></label>`).join('')}</fieldset>`;
      if (question.type === 'number') return `<label class="question-number-label" for="number-${esc(question.id)}">Your answer${question.unit ? ` (${esc(question.unit)})` : ''}</label><input class="question-answer-input" type="text" inputmode="decimal" autocomplete="off" id="number-${esc(question.id)}" data-number-answer value="${esc(attempt.number || '')}" placeholder="Enter a number"><p class="question-help">You can enter a decimal or a fraction such as 3/2.</p>`;
      if (question.type === 'graph') return '<div class="question-graph-host" data-question-graph></div>';
      if (question.type === 'proof') return `<label class="question-proof-label" for="proof-${esc(question.id)}">Your proof</label><textarea class="question-proof-input" id="proof-${esc(question.id)}" data-proof-draft rows="7" placeholder="State your assumptions and write the argument step by step."></textarea><p class="question-help">Your draft saves as you type. Proofs are self-assessed against a model argument and checklist; they are never automatically graded.</p>`;
      return '';
    }
    hintsHTML(question, attempt) { return (question.hints || []).slice(0, attempt.hintsShown).map((hint, index) => `<div class="question-hint"><strong>Hint ${index + 1}</strong><p>${esc(hint)}</p></div>`).join(''); }
    showHint() {
      const question = this.current;
      const attempt = attemptFor(this.record, question);
      attempt.hintsShown = Math.min((question.hints || []).length, attempt.hintsShown + 1);
      this.container.querySelector('.question-hints').innerHTML = this.hintsHTML(question, attempt);
      const button = this.container.querySelector('[data-hint]');
      button.textContent = `Next hint (${attempt.hintsShown}/${question.hints.length})`;
      button.disabled = attempt.hintsShown >= question.hints.length;
      this.save();
    }
    clearFeedback() {
      const attempt = attemptFor(this.record, this.current);
      delete attempt.feedback;
      if (attempt.status === 'solved') {
        attempt.status = attempt.revealed ? 'reviewed' : null;
        this.save();
        this.renderIndex();
        this.updateProgress();
        this.updateStatus();
      }
      this.renderFeedback();
    }
    checkAnswer() {
      const question = this.current;
      const attempt = attemptFor(this.record, question);
      let correct = false, message = '';
      if (question.type === 'choice') {
        if (!Number.isInteger(attempt.choice)) { attempt.feedback = { kind: 'neutral', message: 'Choose an answer first, then check it.' }; this.renderFeedback(); return; }
        const answer = typeof question.answer === 'number' ? question.answer : question.options.indexOf(question.answer);
        correct = attempt.choice === answer;
        message = correct ? 'Correct.' : 'Not quite. Try another answer, or use a hint to revisit the idea.';
      } else if (question.type === 'number') {
        const entered = parseNumber(attempt.number);
        if (!Number.isFinite(entered)) { attempt.feedback = { kind: 'neutral', message: 'Enter a finite number or a fraction such as 3/2.' }; this.renderFeedback(); return; }
        const expected = Number(question.answer);
        const tolerance = Number.isFinite(question.tolerance) ? question.tolerance : 1e-9 * Math.max(1, Math.abs(expected));
        correct = Math.abs(entered - expected) <= tolerance;
        message = correct ? 'Correct.' : 'Not quite. Check your counting and try again; a hint can help.';
      } else if (question.type === 'graph') {
        if (!this.graph) { attempt.feedback = { kind: 'neutral', message: 'The graph task is unavailable. Use the worked solution to review this question.' }; this.renderFeedback(); return; }
        this.saveGraph();
        const result = this.graph.check();
        correct = Boolean(result.correct);
        message = result.message || (correct ? 'Correct.' : 'The graph does not meet all the conditions yet. Keep experimenting.');
      }
      if (correct) {
        if (attempt.status !== 'solved') attempt.status = attempt.revealed ? 'reviewed' : 'solved';
        if (attempt.revealed && attempt.status === 'reviewed') message += ' You viewed the solution, so this attempt is recorded as reviewed.';
      }
      attempt.feedback = { kind: correct ? 'correct' : 'incorrect', message, explanation: correct ? String(question.explanation || (question.type !== 'proof' ? question.solution || '' : '')) : '' };
      this.save();
      this.renderFeedback();
      this.renderIndex();
      this.updateProgress();
      this.updateStatus();
    }
    updateStatus() {
      const status = attemptFor(this.record, this.current).status;
      this.container.querySelector('.question-state').textContent = status === 'solved' ? '✓ Solved' : status === 'reviewed' ? '◐ Reviewed' : '';
    }
    renderFeedback() {
      const feedback = attemptFor(this.record, this.current).feedback;
      const target = this.container.querySelector('.question-feedback');
      target.className = `question-feedback${feedback?.kind ? ` ${feedback.kind}` : ''}`;
      target.innerHTML = feedback ? `<p>${esc(feedback.message)}</p>${feedback.explanation ? paragraphHTML(feedback.explanation) : ''}` : '';
    }
    showSolution(focus) {
      const question = this.current;
      const attempt = attemptFor(this.record, question);
      this.saveGraph();
      attempt.revealed = true;
      if (question.type !== 'proof' && attempt.status !== 'solved') attempt.status = 'reviewed';
      delete attempt.feedback;
      this.save();
      this.renderFeedback();
      this.renderSolution();
      this.renderIndex();
      this.updateProgress();
      this.updateStatus();
      this.container.querySelector('[data-solution]').setAttribute('aria-expanded', 'true');
      if (focus) this.container.querySelector('.question-solution h4')?.focus({ preventScroll: true });
    }
    renderSolution() {
      const question = this.current;
      const attempt = attemptFor(this.record, question);
      const target = this.container.querySelector('.question-solution');
      target.hidden = false;
      let answer = '';
      if (question.type === 'choice') {
        const index = typeof question.answer === 'number' ? question.answer : question.options.indexOf(question.answer);
        answer = `<p class="solution-answer"><strong>Answer ${String.fromCharCode(65 + index)}:</strong> ${esc(question.options[index])}</p>`;
      } else if (question.type === 'number') answer = `<p class="solution-answer"><strong>Answer:</strong> ${esc(question.answer)}${question.unit ? ` ${esc(question.unit)}` : ''}</p>`;
      target.innerHTML = `<h4 tabindex="-1">${question.type === 'proof' ? 'One model proof' : 'Worked solution'}</h4>${answer}${paragraphHTML(question.solution || question.explanation)}${question.type === 'proof' ? `<fieldset class="proof-rubric"><legend>Compare your argument</legend>${(question.rubric || []).map((criterion, index) => `<label><input type="checkbox" data-rubric="${index}" ${attempt.rubric[index] ? 'checked' : ''}><span>${esc(criterion)}</span></label>`).join('')}</fieldset><p class="question-help">Check the steps your proof justifies. Other correct proofs are possible. Marking this proof reviewed records your self-assessment.</p><button type="button" class="question-check" data-mark-reviewed>${attempt.status === 'reviewed' ? '✓ Proof reviewed' : 'Mark proof reviewed'}</button>` : `<p class="question-help">${attempt.status === 'solved' ? 'You solved this question before opening the solution.' : 'This question is recorded as reviewed. Reset this attempt to try it again without the answer.'}</p>`}`;
      target.querySelectorAll('[data-rubric]').forEach(checkbox => checkbox.addEventListener('change', () => { attempt.rubric[Number(checkbox.dataset.rubric)] = checkbox.checked; this.save(); }));
      target.querySelector('[data-mark-reviewed]')?.addEventListener('click', event => {
        attempt.status = 'reviewed';
        attempt.feedback = { kind: 'neutral', message: 'Proof recorded as reviewed through your self-assessment.' };
        this.save();
        this.updateProgress();
        this.renderIndex();
        this.updateStatus();
        event.target.textContent = '✓ Proof reviewed';
        this.renderFeedback();
      });
    }
    resetAttempt() {
      const question = this.current;
      this.destroyGraph();
      this.record.attempts[question.id] = {};
      attemptFor(this.record, question);
      this.save();
      this.renderIndex();
      this.renderCard();
      this.updateProgress();
      const attempt = attemptFor(this.record, question);
      attempt.feedback = { kind: 'neutral', message: 'This attempt has been reset. Start again when you are ready.' };
      this.renderFeedback();
      this.container.querySelector('.question-card h3')?.focus({ preventScroll: true });
    }
    destroy() {
      this.destroyGraph();
      this.save();
      this.destroyed = true;
    }
  }
  window.QuestionBank = QuestionBank;
})();

</script>
<script>
(() => {
  'use strict';
  const data=window.CHAPTER_DATA;
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const heroes={
    graphs:['Everything begins with<br>a <em>connection.</em>','A graph strips a situation down to two ingredients: objects and the connections between them. Start with a few vertices. See what you can build.'],
    degrees:['Every vertex has<br>a <em>local story.</em>','Count the edges at a vertex and you get its degree. Add those local counts together and a global pattern appears.'],
    paths:['Find your way.<br>Then <em>come back.</em>','A sequence of edges becomes a walk, a path, or a cycle. The difference is what you revisit along the way.'],
    connectivity:['What holds a graph<br><em>together?</em>','Some connections are essential; others have a backup. Remove an edge or a vertex and discover the structure that keeps a graph connected.'],
    trees:['Just enough edges<br>to <em>connect.</em>','A tree connects every vertex without a single cycle. Strip a connected graph down to its essentials and a tree remains.'],
    bipartite:['Two sides.<br>One <em>simple rule.</em>','Split the vertices into two groups. If every edge goes between the groups, the graph is bipartite. An odd cycle is the obstruction.'],
    minors:['Make it smaller.<br>Keep the <em>structure.</em>','Delete what you do not need, then contract an edge. Graph minors let us look for a small structure hidden inside a larger one.'],
    euler:['Every edge.<br><em>Exactly once.</em>','Can you trace every connection without lifting your pencil or retracing an edge? The answer is written in the vertex degrees.'],
    algebra:['When graphs become<br><em>algebra.</em>','Treat an edge set as a vector of zeros and ones. Combining cycles by symmetric difference reveals a surprisingly elegant linear space.'],
    other:['Beyond the<br><em>simple graph.</em>','Add directions, parallel edges, or loops. Explore the conventions that extend graph theory to different kinds of relationships.']
  };
  let active=null,lab=null,questionBank=null,toastTimeout;
  let completed=new Set();
  try{const saved=JSON.parse(localStorage.getItem('diestel-ch1-progress')||'[]');if(Array.isArray(saved))completed=new Set(saved.filter(id=>data.sections.some(s=>s.id===id)));}catch{}
  function persist(){try{localStorage.setItem('diestel-ch1-progress',JSON.stringify([...completed]));}catch{}}
  function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').classList.remove('visible'),2600);}
  function updateNav(){
    $('#lesson-nav').innerHTML=data.sections.map(s=>`<button class="nav-item ${s.id===active?'active':''}" data-section="${esc(s.id)}" ${s.id===active?'aria-current="page"':''}><span class="nav-number">${esc(s.number)}</span><span>${esc(s.title)}</span>${completed.has(s.id)?'<span class="nav-check" aria-label="Completed">✓</span>':''}</button>`).join('');
    $('#lesson-nav').querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.section)));
    const count=completed.size;$('#progress-count').textContent=`${count} of ${data.sections.length}`;$('#progress-fill').style.width=`${count/data.sections.length*100}%`;$('#progress-bar').setAttribute('aria-valuenow',count);
  }
  function closeMobile(){ $('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false'); }
  function navigate(id,{scroll=true,concept=null,question=null}={}){
    const section=data.sections.find(s=>s.id===id)||data.sections[0];
    if(lab){lab.destroy();lab=null;}
    if(questionBank){questionBank.destroy();questionBank=null;}
    active=section.id;
    try{history.replaceState(null,'',`#${active}`);}catch{}
    updateNav();closeMobile();
    const index=data.sections.indexOf(section),hero=heroes[active];
    $('#main').innerHTML=`<div class="lesson-content">
      <section class="hero" aria-labelledby="lesson-title"><div><p class="eyebrow">${esc(section.number)} &nbsp; ${esc(section.title.toUpperCase())}</p><h1 id="lesson-title" tabindex="-1">${hero[0]}</h1><p class="hero-description">${hero[1]}</p><div class="lesson-quicklinks"><button id="jump-practice">Practice ${(window.QUIZ_BANK?.[active]?.length||0)+1} questions ↓</button><span>Quick checks · Graph tasks · Proofs</span></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 166 148"><g fill="none" stroke="#e2ddef" stroke-width="1"><circle cx="83" cy="74" r="58"/><ellipse cx="83" cy="74" rx="74" ry="35" transform="rotate(-38 83 74)"/><ellipse cx="83" cy="74" rx="74" ry="35" transform="rotate(38 83 74)"/></g><circle cx="140" cy="62" r="4" fill="#7160d6"/><circle cx="40" cy="113" r="3" fill="#a294df"/><circle cx="44" cy="34" r="3.5" fill="#189a82"/><circle cx="119" cy="118" r="2.5" fill="#c2b7e6"/></svg><span class="hero-number">${String(index+1).padStart(2,'0')}</span></div></section>
      <section class="lab-card" aria-label="Interactive ${esc(section.title)} experiment"><div class="lab-heading"><div class="lab-heading-left"><svg class="tiny-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 5L15 3L17 15L5 17L4 5L17 15M5 17L15 3" stroke="currentColor"/><g fill="currentColor"><circle cx="4" cy="5" r="2"/><circle cx="15" cy="3" r="2"/><circle cx="17" cy="15" r="2"/><circle cx="5" cy="17" r="2"/></g></svg><span>${active==='graphs'?'THE GRAPH PLAYGROUND':esc(section.title.toUpperCase())+' LAB'}</span></div><span class="live-badge">INTERACTIVE</span></div><div id="lab-content"></div></section>
      <div class="section-divider"><h2>The ideas, unpacked.</h2><div class="section-toolbar"><p>${section.concepts.length} concepts</p><button class="text-button" id="expand-all">Expand all ↗</button></div></div>
      <div class="concept-grid" id="concept-grid">${section.concepts.map((c,i)=>conceptCard(c,section.id,i)).join('')}</div>
      ${section.theorems?.length?`<div class="section-divider"><h2>Why it works.</h2><p>Theorems &amp; proof ideas</p></div><div class="theorem-grid">${section.theorems.map((t,i)=>`<article class="theorem-card"><div class="theorem-marker">${['◇','∴','↗'][i%3]}</div><div><h3>${esc(t.name)}</h3><p>${esc(t.statement)}</p>${t.insight?`<details class="proof-details"><summary>See the idea behind the proof</summary><p>${esc(t.insight)}</p></details>`:''}</div></article>`).join('')}</div>`:''}
      <section id="practice-bank" class="question-bank" aria-label="Practice questions for ${esc(section.title)}"></section>
      <div class="lesson-end"><button class="complete-button ${completed.has(active)?'done':''}" id="complete-button">${completed.has(active)?'✓ Section explored':'○ Mark as explored'}</button><button class="next-button" id="next-button">${index===data.sections.length-1?'Back to the beginning':`Next: ${esc(data.sections[index+1].title)}`}<span aria-hidden="true">→</span></button></div>
      <footer class="page-footer"><span>Small graphs. Big ideas. <span class="heart">✧</span></span><span>Original explanations · Diestel, Chapter 1 · <a href="#" class="footer-about">Sources &amp; scope ↗</a></span></footer>
    </div>`;
    lab=new window.GraphLab($('#lab-content'),active);
    questionBank=new window.QuestionBank($('#practice-bank'),active);
    $('#jump-practice').addEventListener('click',()=>{$('#practice-bank').scrollIntoView({block:'start',behavior:'smooth'});$('#practice-bank').querySelector('h2')?.focus({preventScroll:true});});
    $('#expand-all').addEventListener('click',()=>{
      const cards=[...$('#concept-grid').querySelectorAll('details')],open=cards.some(c=>!c.open);cards.forEach(c=>c.open=open);$('#expand-all').textContent=open?'Collapse all ↙':'Expand all ↗';
    });
    $('#concept-grid').querySelectorAll('.concept-card').forEach(c=>c.addEventListener('toggle',()=>{const cards=[...$('#concept-grid').querySelectorAll('details')];$('#expand-all').textContent=cards.every(c=>c.open)?'Collapse all ↙':'Expand all ↗';}));
    $('#complete-button').addEventListener('click',()=>{
      if(completed.has(active)){completed.delete(active);}else{completed.add(active);toast(completed.size===data.sections.length?'All ten sections explored. Nicely connected.':'Section marked as explored.');}
      persist();updateNav();$('#complete-button').classList.toggle('done',completed.has(active));$('#complete-button').textContent=completed.has(active)?'✓ Section explored':'○ Mark as explored';
    });
    $('#next-button').addEventListener('click',()=>navigate(data.sections[(index+1)%data.sections.length].id));
    $('.footer-about').addEventListener('click',e=>{e.preventDefault();$('#about-dialog').showModal();});
    if(scroll){window.scrollTo({top:0,behavior:'instant'});if(concept===null&&question===null)$('#lesson-title').focus({preventScroll:true});}
    if(concept!==null){const card=$(`#concept-${concept}`);if(card){card.open=true;requestAnimationFrame(()=>{card.scrollIntoView({block:'center'});card.querySelector('summary').focus({preventScroll:true});});}}
    if(question!==null){questionBank.goToQuestion(question);requestAnimationFrame(()=>{$('#practice-bank').scrollIntoView({block:'start'});$('#practice-bank').querySelector('h2')?.focus({preventScroll:true});});}
  }
  function conceptCard(c,sid,i){
    const visual=window.conceptVisual?window.conceptVisual(c,sid):{svg:'',caption:''};
    return `<details class="concept-card" id="concept-${i}"><summary><span class="concept-mini" aria-hidden="true">${visual.svg}</span><span><h3>${esc(c.name)}</h3><span class="concept-tag">${esc(c.tag||'DEFINITION & INTUITION')}</span></span></summary><div class="concept-body concept-expanded"><p>${esc(c.explanation)}</p>${c.formula?`<div class="formula">${esc(c.formula)}</div>`:''}${visual.svg?`<figure class="concept-figure"><div class="concept-figure-drawing" aria-hidden="true">${visual.svg}</div><figcaption>${esc(visual.caption)}</figcaption></figure>`:''}</div></details>`;
  }
  function aboutHTML(){
    const total=data.sections.reduce((n,s)=>n+s.concepts.length,0);
    const questions=data.sections.reduce((n,s)=>n+(window.QUIZ_BANK?.[s.id]?.length||0)+1,0);
    return `<p>This is an independent, interactive companion to <em>Chapter 1: The Basics</em> of Reinhard Diestel’s <em>Graph Theory</em>, sixth edition (2025). It includes all ten sections, ${total} concept explanations, the principal results with original proof ideas, and ${questions} original practice questions.</p><p>The diagrams and text are newly written for this page. The companion supports reading the book; it does not reproduce the chapter or its exercise collection. Additional concepts mentioned in the exercises and notes are labeled in their explanations.</p><p><strong>How to explore:</strong> use the chapter navigation, change a graph in each lab, open a concept card, then practice. Each section has quick checks, interactive graph tasks, and proof questions with graduated hints and model solutions. Quick checks and graph tasks have automatic feedback; proofs have a checklist for self-assessment. Revealing a solution records a review rather than a correct answer.</p><p>Search definitions and questions with <kbd>/</kbd> or <kbd>Ctrl/⌘ K</kbd>. Vertices and edges can be selected by keyboard. Answers, graph attempts, proof drafts, and exploration marks stay in this browser.</p><p><strong>Conventions:</strong> graphs are finite and simple unless stated otherwise. A path’s length is its number of edges. Diestel’s edge density is ε(G) = |E|/|V|; the common normalized density is labeled separately. Lab examples illustrate definitions and theorems on small finite graphs.</p><p><strong>Sources</strong></p><ul class="source-list">${(data.sources||[]).map(s=>`<li><a href="${esc(s.url||s.href||s)}" target="_blank" rel="noopener">${esc(s.title||s.name||s.label||s)}</a></li>`).join('')}</ul><p>Typography: DM Sans and Fraunces, distributed under the <a href="https://openfontlicense.org/" target="_blank" rel="noopener">SIL Open Font License</a>. The page works offline; source links open online.</p><button class="complete-button" id="reset-progress">Reset exploration marks</button>`;
  }
  $('#about-content').innerHTML=aboutHTML();
  $('#reset-progress').addEventListener('click',()=>{completed.clear();persist();updateNav();if($('#complete-button')){$('#complete-button').classList.remove('done');$('#complete-button').textContent='○ Mark as explored';}toast('Exploration marks reset.');});
  ['about-trigger','source-link'].forEach(id=>$(`#${id}`).addEventListener('click',e=>{e.preventDefault();$('#about-dialog').showModal();}));
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
  function search(query=''){
    const words=query.toLowerCase().trim().split(/\s+/).filter(Boolean),results=[];
    data.sections.forEach(s=>{
      if(!words.length||words.every(w=>`${s.number} ${s.title}`.toLowerCase().includes(w)))results.push({section:s,name:s.title,label:`Section ${s.number}`,concept:null});
      s.concepts.forEach((c,i)=>{if(words.length&&words.every(w=>`${c.name} ${c.explanation} ${c.formula||''}`.toLowerCase().includes(w)))results.push({section:s,name:c.name,label:`${s.number} · ${s.title}`,concept:i});});
      (s.theorems||[]).forEach(t=>{if(words.length&&words.every(w=>`${t.name} ${t.statement}`.toLowerCase().includes(w)))results.push({section:s,name:t.name,label:`${s.number} · Theorem`,concept:null});});
      const practiceQuestions=[...(window.QUIZ_BANK?.[s.id]||[])];
      if(s.challenge)practiceQuestions.unshift({id:`${s.id}-original`,title:`Quick check: ${s.title}`,prompt:s.challenge.question,type:'choice',topic:s.title});
      practiceQuestions.forEach(q=>{if(words.length&&words.every(w=>`${q.title} ${q.prompt} ${q.topic}`.toLowerCase().includes(w)))results.push({section:s,name:q.title,label:`${s.number} · ${q.type==='proof'?'Proof question':q.type==='graph'?'Graph task':'Quick check'}`,concept:null,question:q.id});});
    });
    $('#search-results').innerHTML=results.length?results.slice(0,50).map((r,i)=>`<button class="search-result" data-result="${i}"><strong>${esc(r.name)}</strong><small>${esc(r.label)}</small></button>`).join(''):'<div class="search-empty">No connections found. Try a broader term.</div>';
    $('#search-results').querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{const r=results[Number(b.dataset.result)];$('#search-dialog').close();navigate(r.section.id,{concept:r.concept,question:r.question??null});}));
  }
  function openSearch(){search();$('#search-input').value='';$('#search-dialog').showModal();$('#search-input').focus();}
  $('#search-trigger').addEventListener('click',openSearch);$('#search-input').addEventListener('input',e=>search(e.target.value));
  $('#search-input').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){$('.search-result')?.focus();e.preventDefault();}else if(e.key==='Enter'){$('.search-result')?.click();}});
  document.addEventListener('keydown',e=>{if((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))||((e.ctrlKey||e.metaKey)&&e.key==='k')){e.preventDefault();if(!$('#search-dialog').open)openSearch();}if(e.key==='Escape')closeMobile();});
  $('#mobile-menu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#overlay').classList.toggle('open',open);$('#mobile-menu').setAttribute('aria-expanded',String(open));});
  $('#overlay').addEventListener('click',closeMobile);
  $('#brand-link').addEventListener('click',e=>{e.preventDefault();navigate('graphs');});
  window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active&&data.sections.some(s=>s.id===id))navigate(id);});
  navigate(location.hash.slice(1)||'graphs',{scroll:false});
  window.ChapterApp={navigate,get active(){return active;},get lab(){return lab;},get questionBank(){return questionBank;}};
})();

</script>
</body>
</html>
