      const cards=[...$('#concept-grid').querySelectorAll('details')],open=cards.some(c=>!c.open);cards.forEach(c=>c.open=open);$('#expand-all').textContent=open?'Collapse all ↙':'Expand all ↗';
    });
    $('#concept-grid').querySelectorAll('.concept-card').forEach(c=>c.addEventListener('toggle',()=>{const cards=[...$('#concept-grid').querySelectorAll('details')];$('#expand-all').textContent=cards.every(c=>c.open)?'Collapse all ↙':'Expand all ↗';}));
    $('#complete-button').addEventListener('click',()=>{
      if(completed.has(active)){completed.delete(active);}else{completed.add(active);toast(completed.size===data.sections.length?'All ten sections explored. Nicely connected.':'Section marked as explored.');}
      persist();updateNav();$('#complete-button').classList.toggle('done',completed.has(active));$('#complete-button').textContent=completed.has(active)?'✓ Section explored':'○ Mark as explored';
    });
    $('#next-button').addEventListener('click',()=>navigate(data.sections[(index+1)%data.sections.length].id));
    $('.footer-about').addEventListener('click',e=>{e.preventDefault();$('#about-dialog').showModal();});
    setupQuiz(section);
    if(scroll){window.scrollTo({top:0,behavior:'instant'});if(concept===null)$('#lesson-title').focus({preventScroll:true});}
    if(concept!==null){const card=$(`#concept-${concept}`);if(card){card.open=true;requestAnimationFrame(()=>{card.scrollIntoView({block:'center'});card.querySelector('summary').focus({preventScroll:true});});}}
  }
  function conceptCard(c,sid,i){
    const visual=window.conceptVisual?window.conceptVisual(c,sid):{svg:'',caption:''};
    return `<details class="concept-card" id="concept-${i}"><summary><span class="concept-mini" aria-hidden="true">${visual.svg}</span><span><h3>${esc(c.name)}</h3><span class="concept-tag">${esc(c.tag||'DEFINITION & INTUITION')}</span></span></summary><div class="concept-body concept-expanded"><p>${esc(c.explanation)}</p>${c.formula?`<div class="formula">${esc(c.formula)}</div>`:''}${visual.svg?`<figure class="concept-figure"><div class="concept-figure-drawing" aria-hidden="true">${visual.svg}</div><figcaption>${esc(visual.caption)}</figcaption></figure>`:''}</div></details>`;
  }
  function quizHTML(s){if(!s.challenge)return '';return `<section class="quiz-card" aria-labelledby="quiz-question"><div class="quiz-label">A MOMENT TO THINK</div><h3 id="quiz-question">${esc(s.challenge.question)}</h3><div class="quiz-options">${s.challenge.options.map((o,i)=>`<button class="quiz-option" data-option="${i}">${esc(o)}</button>`).join('')}</div><p class="quiz-result" role="status" id="quiz-result"></p></section>`;}
  function setupQuiz(s){if(!s.challenge)return;const q=s.challenge;document.querySelectorAll('.quiz-option').forEach(b=>b.addEventListener('click',()=>{
    const answer=typeof q.answer==='number'?q.answer:q.options.indexOf(q.answer),chosen=Number(b.dataset.option);
    document.querySelectorAll('.quiz-option').forEach(x=>{x.classList.remove('correct','incorrect');x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');b.classList.add(chosen===answer?'correct':'incorrect');
    $('#quiz-result').textContent=chosen===answer?`Exactly. ${q.explanation}`:'Not quite. Revisit the definition and give it another try.';
  }));}
  function aboutHTML(){
    const total=data.sections.reduce((n,s)=>n+s.concepts.length,0);
    return `<p>This is an independent, interactive companion to <em>Chapter 1: The Basics</em> of Reinhard Diestel’s <em>Graph Theory</em>, sixth edition (2025). It includes all ten sections, ${total} concept explanations, and the principal results with original proof ideas.</p><p>The diagrams and text are newly written for this page. The companion supports reading the book; it does not reproduce the chapter or its exercise collection. Additional concepts mentioned in the exercises and notes are labeled in their explanations.</p><p><strong>How to explore:</strong> use the chapter navigation, change a graph in each lab, open a concept card, then test your understanding. Search any definition with <kbd>/</kbd> or <kbd>Ctrl/⌘ K</kbd>. Vertices can be dragged and selected by keyboard. Completion marks stay in this browser.</p><p><strong>Conventions:</strong> graphs are finite and simple unless stated otherwise. A path’s length is its number of edges. Diestel’s edge density is ε(G) = |E|/|V|; the common normalized density is labeled separately. Lab examples illustrate definitions and theorems on small finite graphs.</p><p><strong>Sources</strong></p><ul class="source-list">${(data.sources||[]).map(s=>`<li><a href="${esc(s.url||s.href||s)}" target="_blank" rel="noopener">${esc(s.title||s.name||s.label||s)}</a></li>`).join('')}</ul><p>Typography: DM Sans and Fraunces, distributed under the <a href="https://openfontlicense.org/" target="_blank" rel="noopener">SIL Open Font License</a>. The page works offline; source links open online.</p><button class="complete-button" id="reset-progress">Reset exploration marks</button>`;
  }
  $('#about-content').innerHTML=aboutHTML();
  $('#reset-progress').addEventListener('click',()=>{completed.clear();persist();updateNav();if($('#complete-button')){$('#complete-button').classList.remove('done');$('#complete-button').textContent='○ Mark as explored';}toast('Exploration marks reset.');});
  ['about-trigger','source-link'].forEach(id=>$(`#${id}`).addEventListener('click',e=>{e.preventDefault();$('#about-dialog').showModal();}));
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
  function search(query=''){
    const words=query.toLowerCase().trim().split(/\s+/).filter(Boolean),results=[];
    data.sections.forEach(s=>{
      if(!words.length||words.every(w=>`${s.number} ${s.title}`.toLowerCase().includes(w)))results.push({section:s,name:s.title,label:`Section ${s.number}`,concept:null});
      s.concepts.forEach((c,i)=>{if(words.length&&words.every(w=>`${c.name} ${c.explanation} ${c.formula||''}`.toLowerCase().includes(w)))results.push({section:s,name:c.name,label:`${s.number} · ${s.title}`,concept:i});});
      (s.theorems||[]).forEach(t=>{if(words.length&&words.every(w=>`${t.name} ${t.statement}`.toLowerCase().includes(w)))results.push({section:s,name:t.name,label:`${s.number} · Theorem`,concept:null});});
    });
    $('#search-results').innerHTML=results.length?results.slice(0,50).map((r,i)=>`<button class="search-result" data-result="${i}"><strong>${esc(r.name)}</strong><small>${esc(r.label)}</small></button>`).join(''):'<div class="search-empty">No connections found. Try a broader term.</div>';
    $('#search-results').querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{const r=results[Number(b.dataset.result)];$('#search-dialog').close();navigate(r.section.id,{concept:r.concept});}));
  }
  function openSearch(){search();$('#search-input').value='';$('#search-dialog').showModal();$('#search-input').focus();}
  $('#search-trigger').addEventListener('click',openSearch);$('#search-input').addEventListener('input',e=>search(e.target.value));
  $('#search-input').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){$('.search-result')?.focus();e.preventDefault();}else if(e.key==='Enter'){$('.search-result')?.click();}});
  document.addEventListener('keydown',e=>{if((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))||((e.ctrlKey||e.metaKey)&&e.key==='k')){e.preventDefault();if(!$('#search-dialog').open)openSearch();}if(e.key==='Escape')closeMobile();});
  $('#mobile-menu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#overlay').classList.toggle('open',open);$('#mobile-menu').setAttribute('aria-expanded',String(open));});
  $('#overlay').addEventListener('click',closeMobile);
  $('#brand-link').addEventListener('click',e=>{e.preventDefault();navigate('graphs');});
  window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active)navigate(id);});
  navigate(location.hash.slice(1)||'graphs',{scroll:false});
  window.ChapterApp={navigate,get active(){return active;},get lab(){return lab;}};
})();

</script>
</body>
</html>
