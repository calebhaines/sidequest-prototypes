.ml-pat-header h2{text-transform:uppercase!important}

/* Kilter Kitchen equipment system. Inline font and styles keep every app offline. */
:root {
  --kk-bg: #111517;
  --kk-steel: #202629;
  --kk-surface: #181e20;
  --kk-line: #3b4447;
  --kk-enamel: #f1ecdc;
  --kk-orange: #ff8d45;
  --kk-yellow: #dcc85e;
  --kk-muted: #929c99;
  --kk-accent: var(--kk-orange);
  --kk-heading: 'Kilter Condensed', 'Arial Narrow', Arial, sans-serif;
  --kk-ui: Arial, 'Helvetica Neue', sans-serif;
  --kk-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  color-scheme: dark;
}
body {
  color: var(--kk-enamel);
  font-family: var(--kk-ui);
  background: radial-gradient(ellipse at 86% -12%, #ff8d4509, transparent 48%),
    repeating-linear-gradient(90deg, transparent 0 79px, #f1ecdc02 79px 80px),
    var(--kk-bg);
}
:where(h1, h2, h3) { font-family: var(--kk-heading); font-style: normal; }
:where(button, input, select, textarea) { font-family: inherit; }
::selection { background: #ff8d4540; color: #fff9ed; }
:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--kk-yellow);
  outline-offset: 3px;
}
/* A continuous receipt grid is decorative; its contrast stays below the controls. */
@media (prefers-reduced-motion: reduce) {
  .ml-ex-dialog[open], .ml-pat-dialog[open] { animation: none !important; }
}
</style></head>
