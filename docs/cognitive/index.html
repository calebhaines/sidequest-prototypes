<script>
'use strict';
const TASKS = {};
const META = [
{id:'nback',name:'Dual n-back',category:'Memory',glyph:'▦',duration:'1–2 min',description:'Hold two streams in mind. Match a sound and a position from N steps ago.',evidence:'Trained & related-task gains',unit:'back',start:2},
{id:'corsi',name:'Spatial span',category:'Memory',glyph:'⋯',duration:'2 min',description:'Watch a path light up, then retrace the sequence from memory.',evidence:'Spatial memory practice',unit:'level',start:1},
{id:'digits',name:'Backward digit span',category:'Memory',glyph:'321',duration:'2 min',description:'Hold a number sequence, then recall its digits in reverse order.',evidence:'Working memory practice',unit:'level',start:1},
{id:'operation',name:'Operation span',category:'Memory',glyph:'A+',duration:'2–4 min',description:'Judge an arithmetic statement, remember a letter, and recall the interleaved sequence.',evidence:'Complex working-memory practice',unit:'level',start:1},
{id:'symmetry',name:'Symmetry span',category:'Memory',glyph:'▥',duration:'2–4 min',description:'Judge a pattern’s symmetry while holding a sequence of spatial locations in memory.',evidence:'Complex working-memory practice',unit:'level',start:1},
{id:'stroop',name:'Color & conflict',category:'Attention',glyph:'Aa',duration:'1 min',description:'Name the ink color while a competing word asks for your attention.',evidence:'Inhibition task practice',unit:'level',start:1},
{id:'switch',name:'Rule switching',category:'Attention',glyph:'⇄',duration:'1 min',description:'Follow changing rules. Sort numbers by parity or magnitude.',evidence:'Executive task practice',unit:'level',start:1},
{id:'vigilance',name:'Steady attention',category:'Attention',glyph:'◯',duration:'1 min',description:'Respond to circles, let triangles pass. Stay present through a paced stream.',evidence:'Attention task practice',unit:'level',start:1},
{id:'search',name:'Visual search',category:'Attention',glyph:'T',duration:'1 min',description:'Find one target among distractors. Aim for accuracy, then fluency.',evidence:'Visual attention practice',unit:'level',start:1},
{id:'divided',name:'Peripheral focus',category:'Attention',glyph:'⊙',duration:'2 min',description:'Catch a central detail and a peripheral location in one brief glimpse.',evidence:'Research-inspired speed task',unit:'level',start:1},
{id:'reasoning',name:'Pattern reasoning',category:'Reasoning',glyph:'∴',duration:'2 min',description:'Discover the rule behind a sequence and choose what comes next.',evidence:'Reasoning skill practice',unit:'level',start:1},
{id:'rotation',name:'Mental rotation',category:'Reasoning',glyph:'↻',duration:'2 min',description:'Turn a shape in your mind. Decide whether its partner is rotated or mirrored.',evidence:'Spatial training evidence',unit:'level',start:1},
{id:'pairs',name:'Paired recall',category:'Learning',glyph:'↔',duration:'2 min',description:'Study unrelated word pairs, then retrieve each partner with a cue.',evidence:'Associative memory practice',unit:'level',start:1},
{id:'retrieval',name:'Spaced retrieval',category:'Learning',glyph:'◷',duration:'2 min',description:'Recall a small set of facts and revisit them over expanding intervals.',evidence:'Strong retention evidence',unit:'review',start:1}
];
const STORE='clear-cognitive-v1';
const freshState=()=>({version:1,history:[],tasks:{},taskData:{}});
let storageOkay=true, state;
try{const raw=localStorage.getItem(STORE);state=raw?sanitize(JSON.parse(raw)):freshState()}catch{state=freshState();storageOkay=false}
function sanitize(data){
 if(!data||data.version!==1||!Array.isArray(data.history)||typeof data.tasks!=='object'||!data.tasks)throw Error('Invalid progress file');
 const out=freshState();out.history=data.history.filter(x=>x&&META.some(m=>m.id===x.id)&&Number.isFinite(x.accuracy)&&x.accuracy>=0&&x.accuracy<=100&&Number.isInteger(x.level)&&x.level>=1&&x.level<=8&&Number.isFinite(x.at)&&x.at>=0&&x.at<=8640000000000000&&Number.isFinite(x.seconds)&&x.seconds>=0).slice(-500).map(x=>({...x,metrics:sanitizeMetrics(x.metrics),profile:sanitizeProfile(x.profile)}));
 for(const m of META){const s=data.tasks[m.id];if(s&&Number.isInteger(s.level)&&s.level>=1&&s.level<=8)out.tasks[m.id]={level:s.level}}
 const cards=data.taskData?.retrieval?.cards;if(cards&&typeof cards==='object'){const clean={};for(const id of ['water','earth','light','photosynthesis','angle','percent','density','metric','correlation','mean','half','byte']){const r=cards[id];if(r&&Number.isFinite(r.due)&&r.due>=0&&Number.isInteger(r.streak)&&r.streak>=0&&r.streak<=5)clean[id]={due:r.due,streak:r.streak,lastReviewed:Number.isFinite(r.lastReviewed)?r.lastReviewed:0}}out.taskData={retrieval:{cards:clean}}}
 return out;
}
function sanitizeMetrics(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return undefined;
 const out={},count=v=>Number.isInteger(v)&&v>=0&&v<=10000,latency=v=>Number.isFinite(v)&&v>=0&&v<=600000;
 if(raw.rtMs===null||latency(raw.rtMs))out.rtMs=raw.rtMs;
 if(count(raw.rtCount))out.rtCount=raw.rtCount;
 if(raw.channels&&typeof raw.channels==='object'){
  const channels={};for(const name of ['position','sound','signal']){const c=raw.channels[name];if(c&&['hit','miss','falseAlarm','correctRejection'].every(k=>count(c[k]))&&c.hit+c.miss+c.falseAlarm+c.correctRejection<=10000)channels[name]={hit:c.hit,miss:c.miss,falseAlarm:c.falseAlarm,correctRejection:c.correctRejection}}

function renderEvidence(){
 main.innerHTML=`<section class="page-title"><p class="eyebrow">Curiosity, with the claims kept small</p><h1>What practice can do.</h1><p class="muted" style="max-width:700px">Research supports learning specific skills. That is different from proving that a collection of browser games improves intelligence, prevents decline, or changes everyday functioning.</p></section><section class="panel"><h2>Useful practice. Honest expectations.</h2><p class="small muted">This library covers major research task families, not every possible cognitive intervention. It adapts familiar paradigms for brief mobile sessions. This particular app has not been studied in a clinical trial.</p><div class="evidence-row"><strong>Working memory<br><span class="small muted">Dual n-back · spatial, digit & complex spans</span></strong><p>Training reliably improves the tasks people practice. N-back reviews find their clearest transfer to other n-back tasks; transfer to other working-memory measures is smaller, and benefits for intelligence or everyday abilities remain unproven. Use these exercises to practice updating and holding information, rather than expecting an IQ increase.</p></div><div class="evidence-row"><strong>Complex span<br><span class="small muted">Operation span · symmetry span</span></strong><p>Complex-span tasks combine remembering items with an intervening task. These exercises adapt established verbal and spatial working-memory paradigms for browser practice. Recall measures items remembered in the correct positions; processing accuracy measures the arithmetic or symmetry decisions, with missed deadlines counted as errors. Higher recall alongside lower processing accuracy can reflect reduced attention to the intervening task. Improved scores describe the practiced task; broader cognitive benefits remain uncertain.</p></div><div class="evidence-row"><strong>Attention & control<br><span class="small muted">Conflict · switching · vigilance · search</span></strong><p>These are well-established ways to exercise and measure specific processes. Being a valid experimental task does not establish broad benefits from practicing our version. Scores describe this exercise. Reaction times also depend on your phone, browser, input method, and interruptions.</p></div><div class="evidence-row"><strong>Processing & reasoning<br><span class="small muted">Peripheral focus · patterns</span></strong><p>The ACTIVE trial found durable trained-ability gains for structured reasoning and speed training in older adults, with less decline in self-reported everyday function. Our brief adaptations do not reproduce those validated protocols, doses, or participant settings. Peripheral focus is not the clinical UFOV assessment or a licensed training program.</p></div><div class="evidence-row"><strong>Spatial skills<br><span class="small muted">Mental rotation</span></strong><p>A large meta-analysis supports the trainability of spatial skills, including some transfer to other spatial tasks. Practicing rotations is a reasonable way to develop that particular skill; a few browser sessions are not a guarantee of broader benefit.</p></div><div class="evidence-row"><strong>Learning & retention<br><span class="small muted">Paired recall · spaced retrieval</span></strong><p>Retrieving studied material and distributing practice over time have strong evidence for longer-term retention. Benefits apply to what you learn. Our cards use cued recognition and feedback, which is easier than unaided recall; the facts and review schedule are a demonstration you can practice.</p></div></section><section class="panel"><h2>Understand your score</h2><p class="small muted">Most exercises report first-answer accuracy. Dual n-back and steady attention report balanced accuracy, with target hits and false alarms separated. Simple span tasks count completely correct sequences. Complex span tasks score items recalled in their correct positions and report processing accuracy separately. Reaction-time summaries use correct responses only. Compare the same exercise at the same difficulty, and allow room for a tired day.</p><p class="small muted">For level-based exercises, two consecutive sessions at 80% or above move the next difficulty up; two below 55% move it down. Complex-span increases require both recall and processing accuracy to meet 80%. You can choose levels 1–8 yourself. These are transparent design choices, not clinically validated thresholds. A daily circuit is a convenience, not a prescribed training dose.</p></section><section class="panel"><h2>The reading behind the choices</h2><ol class="reference-list"><li><strong>Unsworth et al. (2005).</strong> <a href="https://doi.org/10.3758/BF03192720" target="_blank" rel="noopener noreferrer">An automated version of the operation span task.</a><br><span class="muted">A research method for interleaving arithmetic processing with letter recall; our adaptation is not the standardized assessment.</span></li><li><strong>Unsworth et al. (2009).</strong> <a href="https://doi.org/10.1080/09658210902998047" target="_blank" rel="noopener noreferrer">Complex working memory span tasks and higher-order cognition: A latent-variable analysis of the relationship between processing and storage.</a><br><span class="muted">Separates processing accuracy, processing time, and storage accuracy in complex-span tasks.</span></li><li><strong>Simons et al. (2016).</strong> <a href="https://doi.org/10.1177/1529100616661983" target="_blank" rel="noopener noreferrer">Do “Brain-Training” Programs Work?</a><br><span class="muted">A broad review distinguishing trained skills from transfer and everyday outcomes.</span></li><li><strong>Melby-Lervåg, Redick & Hulme (2016).</strong> <a href="https://doi.org/10.1177/1745691616635612" target="_blank" rel="noopener noreferrer">Working Memory Training Does Not Improve Performance on Measures of Intelligence or Other Measures of “Far Transfer”: Evidence From a Meta-Analytic Review.</a><br><span class="muted">Working-memory task gains do not establish intelligence or far-transfer benefits.</span></li><li><strong>Soveri et al. (2017).</strong> <a href="https://doi.org/10.3758/s13423-016-1217-0" target="_blank" rel="noopener noreferrer">Working memory training revisited: A multi-level meta-analysis of n-back training studies.</a><br><span class="muted">The largest transfer effects concerned other n-back tasks; effects on other skills were much smaller.</span></li><li><strong>Rebok et al. (2014).</strong> <a href="https://doi.org/10.1111/jgs.12607" target="_blank" rel="noopener noreferrer">Ten-Year Effects of the Advanced Cognitive Training for Independent and Vital Elderly Cognitive Training Trial on Cognition and Everyday Functioning in Older Adults.</a><br><span class="muted">Durable results for specific structured reasoning and speed interventions in older adults.</span></li><li><strong>Uttal et al. (2013).</strong> <a href="https://doi.org/10.1037/a0028446" target="_blank" rel="noopener noreferrer">The malleability of spatial skills: A meta-analysis of training studies.</a><br><span class="muted">Evidence that spatial skills can improve through training, including transfer within the spatial domain.</span></li><li><strong>Roediger & Karpicke (2006).</strong> <a href="https://doi.org/10.1111/j.1467-9280.2006.01693.x" target="_blank" rel="noopener noreferrer">Test-enhanced learning: Taking memory tests improves long-term retention.</a><br><span class="muted">Retrieval practice supports retention of studied material.</span></li><li><strong>Cepeda et al. (2006).</strong> <a href="https://doi.org/10.1037/0033-2909.132.3.354" target="_blank" rel="noopener noreferrer">Distributed practice in verbal recall tasks: A review and quantitative synthesis.</a><br><span class="muted">Spacing benefits retention; useful intervals depend on how long material must be remembered.</span></li><li><strong>Dunlosky et al. (2013).</strong> <a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener noreferrer">Improving Students’ Learning With Effective Learning Techniques: Promising Directions From Cognitive and Educational Psychology.</a><br><span class="muted">Practice testing and distributed practice were rated high-utility learning techniques.</span></li></ol><p class="small muted">Research notes reviewed October 2026. References support the distinctions above; they do not validate this app.</p></section><section class="panel"><h2>A quiet app, by design</h2><p class="small muted">No account, tracking, analytics, or external scripts. Scores and review schedules stay in this browser’s local storage. Export or reset them on the Progress tab. Hosting follows GitHub Pages’ normal web-server logging.</p><p class="small muted">Download the single HTML file to use it offline. Tone-based dual n-back works without speech services; spoken letters depend on your browser and installed voices and may use your platform’s speech service. The app never requests a microphone.</p><p class="small muted">Large touch targets, visible keyboard focus, reduced-motion support, and text labels accompany the interface. Some tasks inherently require vision, color discrimination, hearing, or quick motor responses, and are not equally accessible to everyone.</p><a href="./index.html" download="clear-cognitive.html">Download Clear as one HTML file →</a></section>`;
}
/* Memory practice tasks. No libraries or network access required. */
TASKS.nback = function (ctx) {
  const n = Math.max(1, Math.min(8, Math.round(ctx.level || 2)));
  const scoredTrials = 20;
  const letters = ['C', 'H', 'K', 'L', 'Q', 'R', 'S', 'T'];
  let alive = true, running = false, trial = -1, previewToken = 0;
  let trialOpened = 0;
  const hitTimes = [];
  let responded = { position: false, sound: false };
  const stats = {
    position: { hit: 0, miss: 0, falseAlarm: 0, correctRejection: 0 },
    sound: { hit: 0, miss: 0, falseAlarm: 0, correctRejection: 0 }
  };
  ctx.onCleanup(function () { alive = false; previewToken++; });
  const available = mode => typeof ctx.audioAvailable !== 'function' || ctx.audioAvailable(mode);
  let mode = available('voice') ? 'voice' : 'tone';
  ctx.setStatus(n + '-back · two channels');
  ctx.setProgress(0, scoredTrials);
  ctx.setHint('Learn the rule, preview the sound, then begin.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Remember position and sound separately.</strong><p>Tap Position when the lit square is in the same place as ' + n + ' steps earlier. Tap Sound when the sound repeats the one from ' + n + ' steps earlier. Both can match, or neither can match.</p><p>There are ' + n + ' warm-up steps, then 20 scored steps. Each step lasts 2.5 seconds. No response means “no match.”</p><p>Your score gives equal weight to finding matches and avoiding false alarms, then averages both channels.</p></div><label class="prompt" for="nback-sound-mode">Sound type</label><select class="choice" id="nback-sound-mode"><option value="voice">Spoken letters</option><option value="tone">Musical tones</option></select><p class="task-note" id="nback-audio-description"></p>';
  const select = ctx.stage.querySelector('select');
  const description = ctx.stage.querySelector('#nback-audio-description');
  select.value = mode;
  Array.from(select.options).forEach(option => { option.disabled = !available(option.value); });
  const describe = function () {
    description.textContent = mode === 'voice'
      ? 'Use headphones or a quiet room. Match the letter you hear; it will not appear on screen. If the preview is silent, choose Musical tones before beginning.'
      : 'Each sound has a fixed pitch. Match the pitch you hear. This is an auditory n-back variation, with no letter names to remember.';
  };
  describe();
  ctx.listen(select, 'change', function () { mode = select.value; previewToken++; describe(); });
  const preview = ctx.button('Preview sounds', function () {
    const token = ++previewToken;
    const previewLetters = ['C', 'L', 'C'];
    previewLetters.forEach(function (letter, index) {
      ctx.timeout(function () {
        if (alive && !running && token === previewToken) ctx.audio(letter, mode);
      }, index * 1100);
    });
    ctx.setHint('Listen: first sound, different sound, then the first sound again.');
  });
  preview.disabled = !available(mode);
  const begin = ctx.button('Begin ' + n + '-back', start, { primary: true });
  begin.disabled = !available('voice') && !available('tone');
  if (begin.disabled) ctx.setHint('This browser cannot play the required audio. Try another browser.');

  function shuffle(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
  }
  function makeSequence(options) {
    const matches = shuffle(Array.from({ length: scoredTrials }, (_, i) => i < 6));
    const sequence = [];
    for (let i = 0; i < n + scoredTrials; i++) {
      if (i >= n && matches[i - n]) sequence.push(sequence[i - n]);
      else {
        const choices = options.filter(item => i < n || item !== sequence[i - n]);
        sequence.push(choices[Math.floor(Math.random() * choices.length)]);
      }
    }
    return sequence;
  }
  let positions, sounds, cells, positionButton, soundButton;
  function start() {
    if (!alive || running) return;
    running = true;
    previewToken++;
    positions = makeSequence([0, 1, 2, 3, 4, 5, 6, 7, 8]);
    sounds = makeSequence(letters);
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="task-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto 20px" role="img" aria-label="Nine positions for the visual sequence">' + Array.from({ length: 9 }, () => '<div class="tile" style="aspect-ratio:1;border-radius:18px;transition:background .1s"></div>').join('') + '</div><p class="task-note" style="text-align:center">Position: <kbd>F</kbd> &nbsp; Sound: <kbd>J</kbd><br>Only respond to matches.</p>';
    cells = Array.from(ctx.stage.querySelectorAll('.tile'));
    positionButton = ctx.button('Position · F', () => answer('position'));
    soundButton = ctx.button('Sound · J', () => answer('sound'));
    ctx.listen(document, 'keydown', function (event) {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const key = event.key.toLowerCase();
      if (key === 'f' || key === 'j') {
        event.preventDefault();
        answer(key === 'f' ? 'position' : 'sound');
      }
    });
    nextTrial();
  }
  function answer(channel) {
    if (!alive || !running || trial < n || trial >= n + scoredTrials || responded[channel]) return;
    responded[channel] = true;
    const sequence = channel === 'position' ? positions : sounds;
    if (sequence[trial] === sequence[trial - n]) hitTimes.push(performance.now() - trialOpened);
    const button = channel === 'position' ? positionButton : soundButton;
    button.classList.add('primary');
    button.textContent = channel === 'position' ? 'Position marked ✓' : 'Sound marked ✓';
    button.setAttribute('aria-pressed', 'true');
  }
  function nextTrial() {
    if (!alive || !running) return;
    trial++;
    if (trial >= n + scoredTrials) { complete(); return; }
    responded = { position: false, sound: false };
    const warmup = trial < n;
    [positionButton, soundButton].forEach(button => {
      button.disabled = warmup;
      button.classList.remove('primary');
      button.setAttribute('aria-pressed', 'false');
    });
    positionButton.textContent = 'Position · F';
    soundButton.textContent = 'Sound · J';
    ctx.setStatus(warmup ? 'Warm-up ' + (trial + 1) + ' of ' + n : 'Step ' + (trial - n + 1) + ' of ' + scoredTrials + ' · ' + n + '-back');
    ctx.setHint(warmup ? 'Remember this position and sound. Responses begin after warm-up.' : 'Compare with ' + n + ' steps earlier. Mark each matching channel.');
    cells.forEach((cell, i) => cell.classList.toggle('lit', i === positions[trial]));
    trialOpened = performance.now();
    ctx.audio(sounds[trial], mode);
    const currentTrial = trial;
    ctx.timeout(function () {
      if (alive && running && trial === currentTrial) cells.forEach(cell => cell.classList.remove('lit'));
    }, 650);
    ctx.timeout(function () {
      if (!alive || !running || trial !== currentTrial) return;
      if (!warmup) {
        ['position', 'sound'].forEach(function (channel) {
          const sequence = channel === 'position' ? positions : sounds;
          const target = sequence[trial] === sequence[trial - n];
          const result = target ? (responded[channel] ? 'hit' : 'miss') : (responded[channel] ? 'falseAlarm' : 'correctRejection');
          stats[channel][result]++;
        });
        ctx.setProgress(trial - n + 1, scoredTrials);
      }
      nextTrial();
    }, 2500);
  }
  function complete() {
    running = false;
    if (!alive) return;
    alive = false;
    const balanced = s => 50 * (s.hit / (s.hit + s.miss) + s.correctRejection / (s.correctRejection + s.falseAlarm));
    const positionScore = balanced(stats.position);
    const soundScore = balanced(stats.sound);
    const accuracy = (positionScore + soundScore) / 2;
    const sortedTimes = hitTimes.slice().sort((a, b) => a - b);
    const middle = Math.floor(sortedTimes.length / 2);
    const medianHitTime = sortedTimes.length ? (sortedTimes.length % 2 ? sortedTimes[middle] : (sortedTimes[middle - 1] + sortedTimes[middle]) / 2) : null;
    const formatStats = s => s.hit + ' hits · ' + s.miss + ' misses · ' + s.falseAlarm + ' false alarms · ' + s.correctRejection + ' correct rejections';
    ctx.finish({
      accuracy: accuracy, variant: mode,
      metrics: { rtMs: medianHitTime, rtCount: hitTimes.length, channels: { position: { ...stats.position }, sound: { ...stats.sound } } },
      correct: stats.position.hit + stats.position.correctRejection + stats.sound.hit + stats.sound.correctRejection,
      total: scoredTrials * 2,
      metric: 'Balanced accuracy', value: Math.round(accuracy) + '%',
      details: [
        { label: 'Level', value: n + '-back · ' + (mode === 'voice' ? 'spoken letters' : 'musical tones') },
        { label: 'Position · ' + Math.round(positionScore) + '%', value: formatStats(stats.position) },
        { label: 'Sound · ' + Math.round(soundScore) + '%', value: formatStats(stats.sound) },
        { label: 'How scoring works', value: 'For each channel, average the match hit rate and the nonmatch rejection rate. Then average both channels. Making no responses scores 50%.' }
      ],
      summary: 'You completed ' + n + '-back. This score measures performance on this practice task; it is not an IQ score.'
    });
  }
};

TASKS.corsi = function (ctx) {
  const length = Math.max(3, Math.min(10, Math.round(ctx.level || 1) + 2));
  const rounds = 5;
  let alive = true, phase = 'ready', round = 0, sequence = [], response = [], correct = 0, itemsCorrect = 0;
  const outcomes = [];
  ctx.onCleanup(function () { alive = false; phase = 'closed'; });
  ctx.setStatus('Spatial span · ' + length + ' positions');
  ctx.setProgress(0, rounds);
  ctx.setHint('Watch a sequence, then tap it back in the same order.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Follow the path.</strong><p>Watch ' + length + ' tiles light up one at a time. After they finish, tap the same tiles in the same order. Tiles can appear more than once.</p><p>Practice has 5 rounds. A round counts as correct only when the complete sequence matches.</p></div>';
  ctx.button('Begin spatial span', start, { primary: true });
  let cells, footer;
  function start() {
    if (!alive || phase !== 'ready') return;
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="task-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:14px auto">' + Array.from({ length: 9 }, (_, i) => '<button class="tile" style="aspect-ratio:1;border-radius:18px;font-size:1.15rem" aria-label="Tile ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div><p class="task-note" style="text-align:center" id="spatial-input-status"></p>';
    cells = Array.from(ctx.stage.querySelectorAll('.tile'));
    footer = ctx.stage.querySelector('#spatial-input-status');
    cells.forEach((cell, index) => ctx.listen(cell, 'click', () => choose(index)));
    nextRound();
  }
  function nextRound() {
    if (!alive) return;
    round++;
    phase = 'show';
    response = [];
    sequence = [];
    while (sequence.length < length) {
      const value = Math.floor(Math.random() * 9);
      if (!sequence.length || value !== sequence[sequence.length - 1]) sequence.push(value);
    }
    ctx.controls.innerHTML = '';
    ctx.setStatus('Round ' + round + ' of ' + rounds + ' · watch');
    ctx.setHint('Remember the order. Wait until the sequence ends.');
    footer.textContent = length + ' positions to remember';
    cells.forEach(cell => { cell.disabled = true; cell.classList.remove('lit'); });
    sequence.forEach(function (tile, index) {
      ctx.timeout(function () {
        if (alive && phase === 'show') cells[tile].classList.add('lit');
      }, 500 + index * 850);
      ctx.timeout(function () {
        if (alive && phase === 'show') cells[tile].classList.remove('lit');
      }, 1050 + index * 850);
    });
    ctx.timeout(function () {
      if (!alive || phase !== 'show') return;
      phase = 'recall';
      cells.forEach(cell => { cell.disabled = false; cell.classList.remove('lit'); });
      ctx.setStatus('Round ' + round + ' of ' + rounds + ' · your turn');
      ctx.setHint('Tap the tiles in the same order.');
      footer.textContent = '0 of ' + length + ' entered';
      ctx.button('Clear taps', function () {
        if (phase !== 'recall') return;
        response = [];
        footer.textContent = '0 of ' + length + ' entered';
      });
    }, 500 + length * 850);
  }
  function choose(index) {
    if (!alive || phase !== 'recall') return;
    response.push(index);
    footer.textContent = response.length + ' of ' + length + ' entered';
    cells[index].classList.add('lit');
    ctx.timeout(() => { if (alive && phase === 'recall') cells[index].classList.remove('lit'); }, 130);
    if (response.length === length) grade();
  }
  function grade() {
    phase = 'feedback';
    const passed = sequence.every((value, i) => value === response[i]);
    itemsCorrect += sequence.filter((value, i) => value === response[i]).length;
    if (passed) correct++;
    outcomes.push(passed);
    ctx.setProgress(round, rounds);
    cells.forEach(cell => { cell.disabled = true; cell.classList.remove('lit'); });
    ctx.controls.innerHTML = '';
    ctx.setStatus(passed ? 'Sequence correct' : 'Sequence complete');
    ctx.setHint(passed ? 'You reproduced all ' + length + ' positions.' : 'Keep practicing the order. The next round uses a fresh sequence.');
    footer.textContent = passed ? '✓ ' + response.map(i => i + 1).join(' → ') : 'Your taps: ' + response.map(i => i + 1).join(' → ') + ' · Sequence: ' + sequence.map(i => i + 1).join(' → ');
    ctx.button(round === rounds ? 'See results' : 'Next round', function () {
      if (!alive || phase !== 'feedback') return;
      if (round < rounds) nextRound();
      else {
        alive = false;
        phase = 'closed';
        ctx.finish({ accuracy: correct / rounds * 100, correct: correct, total: rounds, metric: 'Sequences recalled', value: correct + ' / ' + rounds,
          metrics: { recall: { correct: itemsCorrect, total: rounds * length, complete: correct, totalSequences: rounds } },
          details: [{ label: 'Span practiced', value: length + ' positions, forward order' }, { label: 'Rounds', value: outcomes.map((passed, i) => (i + 1) + ': ' + (passed ? 'correct' : 'missed')).join(' · ') }],
          summary: 'You recalled ' + correct + ' complete sequences. This is a practice score, not a clinical memory assessment.' });
      }
    }, { primary: true });
  }
};

TASKS.digits = function (ctx) {
  const length = Math.max(3, Math.min(10, Math.round(ctx.level || 1) + 2));
  const rounds = 5;
  let alive = true, phase = 'ready', round = 0, sequence = [], response = '', correct = 0, itemsCorrect = 0;
  const outcomes = [];
  ctx.onCleanup(function () { alive = false; phase = 'closed'; });
  ctx.setStatus('Reverse digit span · ' + length + ' digits');
  ctx.setProgress(0, rounds);
  ctx.setHint('Remember the numbers, then enter them in reverse order.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Hold it, then reverse it.</strong><p>Watch ' + length + ' digits, one at a time. When the sequence ends, enter the digits backwards. For 3, 7, 2, you would enter 2, 7, 3.</p><p>Practice has 5 rounds. Your score counts complete sequences recalled correctly.</p></div>';
  ctx.button('Begin reverse digits', nextRound, { primary: true });
  let display, input, digitButtons, submit;
  function nextRound() {
    if (!alive || (phase !== 'ready' && phase !== 'feedback')) return;
    round++;
    phase = 'show';
    response = '';
    sequence = Array.from({ length: length }, () => Math.floor(Math.random() * 10));
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="stimulus" style="min-height:150px;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:600;font-variant-numeric:tabular-nums" aria-live="polite">Ready</div><p class="task-note" style="text-align:center">Watch every digit. Recall comes next.</p>';
    display = ctx.stage.querySelector('.stimulus');
    ctx.setStatus('Round ' + round + ' of ' + rounds + ' · watch');
    ctx.setHint('Remember ' + length + ' digits, then reverse their order.');
    sequence.forEach(function (digit, index) {
      ctx.timeout(function () { if (alive && phase === 'show') display.textContent = digit; }, 600 + index * 1100);
      ctx.timeout(function () { if (alive && phase === 'show') display.textContent = ''; }, 1400 + index * 1100);
    });
    ctx.timeout(recall, 600 + length * 1100);
  }
  function recall() {
    if (!alive || phase !== 'show') return;
    phase = 'recall';
    ctx.stage.innerHTML = '<label class="prompt" for="reverse-digit-input">Enter the digits backwards</label><input class="choice" id="reverse-digit-input" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="' + length + '" aria-describedby="reverse-digit-count" style="width:100%;font-size:2rem;text-align:center;letter-spacing:.15em;font-variant-numeric:tabular-nums"><p class="task-note" id="reverse-digit-count" style="text-align:center">0 of ' + length + ' digits entered</p><div class="answer-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:310px;margin:14px auto">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'Clear'].map(digit => '<button class="choice" type="button" data-digit="' + digit + '" style="min-height:48px;font-size:1.15rem">' + digit + '</button>').join('') + '</div>';
    input = ctx.stage.querySelector('input');
    digitButtons = Array.from(ctx.stage.querySelectorAll('[data-digit]'));
    const count = ctx.stage.querySelector('#reverse-digit-count');
    function update() {
      input.value = response;
      count.textContent = response.length + ' of ' + length + ' digits entered';
      submit.disabled = response.length !== length;
    }
    digitButtons.forEach(button => ctx.listen(button, 'click', function () {
      if (!alive || phase !== 'recall') return;
      const value = button.dataset.digit;
      if (value === '⌫') response = response.slice(0, -1);
      else if (value === 'Clear') response = '';
      else if (response.length < length) response += value;
      update();
    }));
    ctx.listen(input, 'input', function () {
      if (!alive || phase !== 'recall') return;
      response = input.value.replace(/[^0-9]/g, '').slice(0, length);
      update();
    });
    ctx.listen(input, 'keydown', function (event) { if (event.key === 'Enter' && response.length === length) { event.preventDefault(); grade(); } });
    submit = ctx.button('Check sequence', grade, { primary: true });
    submit.disabled = true;

  }
};

(() => {
  const shuffle = items => {

    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  const random = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const element = (tag, text, className) => {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  };
  const clear = ctx => { ctx.stage.replaceChildren(); ctx.controls.replaceChildren(); };
  const note = (ctx, text) => ctx.stage.append(element('p', text, 'task-note'));
  const percent = (correct, total) => total ? Math.round(100 * correct / total) : 0;
  const showIntro = (ctx, title, copy, beginLabel, begin) => {
    clear(ctx);
    ctx.stage.append(element('h3', title, 'prompt'));
    note(ctx, copy);
    ctx.button(beginLabel, begin, { primary: true });
  };
  const choices = (ctx, options, onChoose) => {
    const grid = element('div', undefined, 'answer-grid');
    let answered = false;
    options.forEach(option => {
      const choice = element('button', String(option), 'choice');
      choice.type = 'button';
      ctx.listen(choice, 'click', () => {
        if (answered) return;
        answered = true;
        grid.querySelectorAll('button').forEach(btn => { btn.disabled = true; });
        onChoose(option, choice);
      });
      grid.append(choice);
    });
    ctx.stage.append(grid);
  };
  const numericChoices = answer => {
    const values = new Set([answer]);
    const scale = Math.max(2, Math.round(Math.abs(answer) * 0.12));
    let tries = 0;
    while (values.size < 4 && tries++ < 40) {
      const difference = random(1, scale);
      values.add(answer + (Math.random() < 0.5 ? -difference : difference));
    }
    for (let i = 1; values.size < 4; i++) values.add(answer + i);
    return shuffle([...values]);
  };

  function sequence(level, index) {
    const easy = ['arithmetic', 'geometric', 'growing', 'squares', 'alternating', 'fibonacci'];
    const harder = ['arithmetic', 'growing', 'affine', 'interleaved', 'squares', 'fibonacci', 'alternating', 'geometric', 'cubes', 'interleaved', 'affine', 'growing'];
    const family = level < 4 ? easy[index % easy.length] : harder[index];
    const terms = [];
    let rule;
    if (family === 'arithmetic') {
      const start = random(level > 3 ? -18 : 1, 15);
      const step = random(2, 3 + level) * (level > 4 && Math.random() < 0.35 ? -1 : 1);
      for (let i = 0; i < 6; i++) terms.push(start + step * i);
      rule = `${step > 0 ? 'Add' : 'Subtract'} ${Math.abs(step)} each time.`;
    } else if (family === 'geometric') {
      const start = random(1, 4), factor = level > 4 ? random(2, 4) : 2;
      for (let i = 0; i < 6; i++) terms.push(start * factor ** i);
      rule = `Multiply the previous number by ${factor}.`;
    } else if (family === 'growing') {
      const first = random(1, 12), firstStep = random(1, 5), increase = random(1, Math.min(4, level));
      terms.push(first);
      for (let i = 0; i < 5; i++) terms.push(terms[i] + firstStep + i * increase);
      const diffs = terms.slice(1).map((v, i) => v - terms[i]);
      rule = `The additions are ${diffs.slice(0, -1).join(', ')}… Each addition grows by ${increase}; the next addition is ${diffs.at(-1)}.`;
    } else if (family === 'squares' || family === 'cubes') {
      const start = random(1, 4), power = family === 'cubes' ? 3 : 2;
      const offset = level >= 6 ? random(1, 8) : 0;
