<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Kitchen effect</title>
<!-- KITCHEN_PLUGIN_DESCRIPTOR -->
<!-- KITCHEN_EFFECT_STYLES -->
</head>
<body>
<main class="kp-shell">
  <header class="kp-heading"><div><span class="kp-eyebrow">KITCHEN / NATIVE EFFECT</span><h1 id="pluginName">Opening the kitchen…</h1><p id="pluginDescription"></p></div><span class="kp-host-clock" id="pluginClock">DAW LINKED</span></header>
  <section class="kp-toolbar" aria-label="Effect controls">
    <label class="kp-bypass"><input id="pluginBypass" type="checkbox"> Bypass</label>
    <label class="kp-recipe-label" id="pluginRecipeLabel"><span>HOUSE RECIPE</span><select id="pluginRecipe" aria-label="Effect recipe"><option value="">Custom settings</option></select></label>
    <button type="button" id="pluginReset">Reset</button>
  </section>
  <div id="pluginSpecialEditor"></div>
  <div id="pluginCaptureEditor"></div>
  <section id="pluginControls" class="kp-controls" aria-label="Effect parameters"></section>
  <footer class="kp-footer"><span id="pluginStatus" role="status" aria-live="polite">Opening native audio…</span><span>DAW CLOCK / NATIVE AUDIO</span></footer>
</main>
<!-- KITCHEN_EFFECT_SCRIPTS -->
</body>
</html>
