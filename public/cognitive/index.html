<script>
'use strict';
const TASKS = {};
const META = [
{id:'nback',name:'Dual n-back',category:'Memory',glyph:'▦',duration:'1–2 min',description:'Hold two streams in mind. Match a sound and a position from N steps ago.',evidence:'Trained & related-task gains',unit:'back',start:2},
{id:'corsi',name:'Spatial span',category:'Memory',glyph:'⋯',duration:'2 min',description:'Watch a path light up, then retrace the sequence from memory.',evidence:'Spatial memory practice',unit:'level',start:1},
{id:'digits',name:'Backward digit span',category:'Memory',glyph:'321',duration:'2 min',description:'Hold a number sequence, then recall its digits in reverse order.',evidence:'Working memory practice',unit:'level',start:1},
{id:'stroop',name:'Color & conflict',category:'Attention',glyph:'Aa',duration:'1 min',description:'Name the ink color while a competing word asks for your attention.',evidence:'Inhibition task practice',unit:'level',start:1},
{id:'switch',name:'Rule switching',category:'Attention',glyph:'⇄',duration:'1 min',description:'Follow changing rules. Sort numbers by parity or magnitude.',evidence:'Executive task practice',unit:'level',start:1},
{id:'vigilance',name:'Steady attention',category:'Attention',glyph:'◯',duration:'1 min',description:'Respond to circles, let triangles pass. Stay present through a paced stream.',evidence:'Attention task practice',unit:'level',start:1},
{id:'search',name:'Visual search',category:'Attention',glyph:'T',duration:'1 min',description:'Find one target among distractors. Aim for accuracy, then fluency.',evidence:'Visual attention practice',unit:'level',start:1},
{id:'divided',name:'Peripheral focus',category:'Attention',glyph:'⊙',duration:'2 min',description:'Catch a central detail and a peripheral location in one brief glimpse.',evidence:'Research-inspired speed task',unit:'level',start:1},
{id:'reasoning',name:'Pattern reasoning',category:'Reasoning',glyph:'∴',duration:'2 min',description:'Discover the rule behind a sequence and choose what comes next.',evidence:'Reasoning skill practice',unit:'level',start:1},
{id:'rotation',name:'Mental rotation',category:'Reasoning',glyph:'↻',duration:'2 min',description:'Turn a shape in your mind. Decide whether its partner is rotated or mirrored.',evidence:'Spatial training evidence',unit:'level',start:1},
{id:'pairs',name:'Paired recall',category:'Learning',glyph:'↔',duration:'2 min',description:'Study unrelated word pairs, then retrieve each partner with a cue.',evidence:'Associative memory practice',unit:'level',start:1},
{id:'retrieval',name:'Spaced retrieval',category:'Learning',glyph:'◷',duration:'2 min',description:'Recall a small set of facts and revisit them over expanding intervals.',evidence:'Strong retention evidence',unit:'review',start:1}
];
const STORE='clear-cognitive-v1';
const freshState=()=>({version:1,history:[],tasks:{},taskData:{}});
let storageOkay=true, state;
try{const raw=localStorage.getItem(STORE);state=raw?sanitize(JSON.parse(raw)):freshState()}catch{state=freshState();storageOkay=false}
function sanitize(data){
 if(!data||data.version!==1||!Array.isArray(data.history)||typeof data.tasks!=='object'||!data.tasks)throw Error('Invalid progress file');
 const out=freshState();out.history=data.history.filter(x=>x&&META.some(m=>m.id===x.id)&&Number.isFinite(x.accuracy)&&x.accuracy>=0&&x.accuracy<=100&&Number.isInteger(x.level)&&x.level>=1&&x.level<=8&&Number.isFinite(x.at)&&Number.isFinite(x.seconds)&&x.seconds>=0).slice(-500);
 for(const m of META){const s=data.tasks[m.id];if(s&&Number.isInteger(s.level)&&s.level>=1&&s.level<=8)out.tasks[m.id]={level:s.level}}
 const cards=data.taskData?.retrieval?.cards;if(cards&&typeof cards==='object'){const clean={};for(const id of ['water','earth','light','photosynthesis','angle','percent','density','metric','correlation','mean','half','byte']){const r=cards[id];if(r&&Number.isFinite(r.due)&&r.due>=0&&Number.isInteger(r.streak)&&r.streak>=0&&r.streak<=5)clean[id]={due:r.due,streak:r.streak,lastReviewed:Number.isFinite(r.lastReviewed)?r.lastReviewed:0}}out.taskData={retrieval:{cards:clean}}}
 return out;
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOkay=true}catch{storageOkay=false;notify('Storage is unavailable. Export progress to keep this session.')}}
function taskState(id){if(!state.tasks[id])state.tasks[id]={level:META.find(m=>m.id===id).start};return state.tasks[id]}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const $=(sel)=>document.querySelector(sel);
const main=$('#main');let currentView='practice',activeRun=null,circuit=null,filter='All';
function notify(message){const node=$('#toast');node.textContent=message;node.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>node.hidden=true,4000)}
function dayKey(at=Date.now()){const d=new Date(at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

 main.innerHTML=`<section class="page-title"><p class="eyebrow">Curiosity, with the claims kept small</p><h1>What practice can do.</h1><p class="muted" style="max-width:700px">Research supports learning specific skills. That is different from proving that a collection of browser games improves intelligence, prevents decline, or changes everyday functioning.</p></section><section class="panel"><h2>Useful practice. Honest expectations.</h2><p class="small muted">This library covers major research task families, not every possible cognitive intervention. It adapts familiar paradigms for brief mobile sessions. This particular app has not been studied in a clinical trial.</p><div class="evidence-row"><strong>Working memory<br><span class="small muted">Dual n-back · spatial & digit spans</span></strong><p>Training reliably improves the tasks people practice. N-back reviews find their clearest transfer to other n-back tasks; transfer to other working-memory measures is smaller, and benefits for intelligence or everyday abilities remain unproven. Use these exercises to practice updating and holding information, rather than expecting an IQ increase.</p></div><div class="evidence-row"><strong>Attention & control<br><span class="small muted">Conflict · switching · vigilance · search</span></strong><p>These are well-established ways to exercise and measure specific processes. Being a valid experimental task does not establish broad benefits from practicing our version. Scores describe this exercise. Reaction times also depend on your phone, browser, input method, and interruptions.</p></div><div class="evidence-row"><strong>Processing & reasoning<br><span class="small muted">Peripheral focus · patterns</span></strong><p>The ACTIVE trial found durable trained-ability gains for structured reasoning and speed training in older adults, with less decline in self-reported everyday function. Our brief adaptations do not reproduce those validated protocols, doses, or participant settings. Peripheral focus is not the clinical UFOV assessment or a licensed training program.</p></div><div class="evidence-row"><strong>Spatial skills<br><span class="small muted">Mental rotation</span></strong><p>A large meta-analysis supports the trainability of spatial skills, including some transfer to other spatial tasks. Practicing rotations is a reasonable way to develop that particular skill; a few browser sessions are not a guarantee of broader benefit.</p></div><div class="evidence-row"><strong>Learning & retention<br><span class="small muted">Paired recall · spaced retrieval</span></strong><p>Retrieving studied material and distributing practice over time have strong evidence for longer-term retention. Benefits apply to what you learn. Our cards use cued recognition and feedback, which is easier than unaided recall; the facts and review schedule are a demonstration you can practice.</p></div></section><section class="panel"><h2>Understand your score</h2><p class="small muted">Most exercises report first-answer accuracy. Dual n-back and steady attention report balanced accuracy, with target hits and false alarms separated. Span tasks count completely correct sequences. Reaction-time summaries use correct responses only. Compare the same exercise at the same difficulty, and allow room for a tired day.</p><p class="small muted">For level-based exercises, two consecutive sessions at 80% or above move the next difficulty up; two below 55% move it down. You can choose levels 1–8 yourself. These are transparent design choices, not clinically validated thresholds. A daily circuit is a convenience, not a prescribed training dose.</p></section><section class="panel"><h2>The reading behind the choices</h2><ol class="reference-list"><li><strong>Simons et al. (2016).</strong> <a href="https://doi.org/10.1177/1529100616661983" target="_blank" rel="noopener noreferrer">Do “Brain-Training” Programs Work?</a><br><span class="muted">A broad review distinguishing trained skills 0.1037/0033-2909.132.3.354" target="_blank" rel="noopener noreferrer">Distributed practice in verbal recall tasks: A review and quantitative synthesis.</a><br><span class="muted">Spacing benefits retention; useful intervals depend on how long material must be remembered.</span></li><li><strong>Dunlosky et al. (2013).</strong> <a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener noreferrer">Improving Students’ Learning With Effective Learning Techniques: Promising Directions From Cognitive and Educational Psychology.</a><br><span class="muted">Practice testing and distributed practice were rated high-utility learning techniques.</span></li></ol><p class="small muted">Research notes reviewed October 2026. References support the distinctions above; they do not validate this app.</p></section><section class="panel"><h2>A quiet app, by design</h2><p class="small muted">No account, tracking, analytics, or external scripts. Scores and review schedules stay in this browser’s local storage. Export or reset them on the Progress tab. Hosting follows GitHub Pages’ normal web-server logging.</p><p class="small muted">Download the single HTML file to use it offline. Tone-based dual n-back works without speech services; spoken letters depend on your browser and installed voices and may use your platform’s speech service. The app never requests a microphone.</p><p class="small muted">Large touch targets, visible keyboard focus, reduced-motion support, and text labels accompany the interface. Some tasks inherently require vision, color discrimination, hearing, or quick motor responses, and are not equally accessible to everyone.</p><a href="./index.html" download="clear-cognitive.html">Download Clear as one HTML file →</a></section>`;

/* Memory practice tasks. No libraries or network access required. */
TASKS.nback = function (ctx) {
  const n = Math.max(1, Math.min(8, Math.round(ctx.level || 2)));
  const scoredTrials = 20;
  const letters = ['C', 'H', 'K', 'L', 'Q', 'R', 'S', 'T'];
  let alive = true, running = false, trial = -1, previewToken = 0;
  let responded = { position: false, sound: false };
  const stats = {
    position: { hit: 0, miss: 0, falseAlarm: 0, correctRejection: 0 },
    sound: { hit: 0, miss: 0, falseAlarm: 0, correctRejection: 0 }
  };
  ctx.onCleanup(function () { alive = false; previewToken++; });
  const available = mode => typeof ctx.audioAvailable !== 'function' || ctx.audioAvailable(mode);
  let mode = available('voice') ? 'voice' : 'tone';
  ctx.setStatus(n + '-back · two channels');
  ctx.setProgress(0, scoredTrials);
  ctx.setHint('Learn the rule, preview the sound, then begin.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Remember position and sound separately.</strong><p>Tap Position when the lit square is in the same place as ' + n + ' steps earlier. Tap Sound when the sound repeats the one from ' + n + ' steps earlier. Both can match, or neither can match.</p><p>There are ' + n + ' warm-up steps, then 20 scored steps. Each step lasts 2.5 seconds. No response means “no match.”</p><p>Your score gives equal weight to finding matches and avoiding false alarms, then averages both channels.</p></div><label class="prompt" for="nback-sound-mode">Sound type</label><select class="choice" id="nback-sound-mode"><option value="voice">Spoken letters</option><option value="tone">Musical tones</option></select><p class="task-note" id="nback-audio-description"></p>';
  const select = ctx.stage.querySelector('select');
  const description = ctx.stage.querySelector('#nback-audio-description');
  select.value = mode;
  Array.from(select.options).forEach(option => { option.disabled = !available(option.value); });
  const describe = function () {
    description.textContent = mode === 'voice'
      ? 'Use headphones or a quiet room. Match the letter you hear; it will not appear on screen. If the preview is silent, choose Musical tones before beginning.'
      : 'Each sound has a fixed pitch. Match the pitch you hear. This is an auditory n-back variation, with no letter names to remember.';
  };
  describe();
  ctx.listen(select, 'change', function () { mode = select.value; previewToken++; describe(); });
  const preview = ctx.button('Preview sounds', function () {
    const token = ++previewToken;
    const previewLetters = ['C', 'L', 'C'];
    previewLetters.forEach(function (letter, index) {
      ctx.timeout(function () {
        if (alive && !running && token === previewToken) ctx.audio(letter, mode);
      }, index * 1100);
    });
    ctx.setHint('Listen: first sound, different sound, then the first sound again.');
  });
  preview.disabled = !available(mode);
  const begin = ctx.button('Begin ' + n + '-back', start, { primary: true });
  begin.disabled = !available('voice') && !available('tone');
  if (begin.disabled) ctx.setHint('This browser cannot play the required audio. Try another browser.');

  function shuffle(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
  }
  function makeSequence(options) {
    const matches = shuffle(Array.from({ length: scoredTrials }, (_, i) => i < 6));
    const sequence = [];
    for (let i = 0; i < n + scoredTrials; i++) {
      if (i >= n && matches[i - n]) sequence.push(sequence[i - n]);
      else {
        const choices = options.filter(item => i < n || item !== sequence[i - n]);
        sequence.push(choices[Math.floor(Math.random() * choices.length)]);
      }
    }
    return sequence;
  }
  let positions, sounds, cells, positionButton, soundButton;
  function start() {
    if (!alive || running) return;
    running = true;
    previewToken++;
    positions = makeSequence([0, 1, 2, 3, 4, 5, 6, 7, 8]);
    sounds = makeSequence(letters);
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="task-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto 20px" role="img" aria-label="Nine positions for the visual sequence">' + Array.from({ length: 9 }, () => '<div class="tile" style="aspect-ratio:1;border-radius:18px;transition:background .1s"></div>').join('') + '</div><p class="task-note" style="text-align:center">Position: <kbd>F</kbd> &nbsp; Sound: <kbd>J</kbd><br>Only respond to matches.</p>';
    cells = Array.from(ctx.stage.querySelectorAll('.tile'));
    positionButton = ctx.button('Position · F', () => answer('position'));
    soundButton = ctx.button('Sound · J', () => answer('sound'));
    ctx.listen(document, 'keydown', function (event) {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const key = event.key.toLowerCase();
      if (key === 'f' || key === 'j') {
        event.preventDefault();
        answer(key === 'f' ? 'position' : 'sound');
      }
    });
    nextTrial();
  }
  function answer(channel) {
    if (!alive || !running || trial < n || trial >= n + scoredTrials || responded[channel]) return;
    responded[channel] = true;
    const button = channel === 'position' ? positionButton : soundButton;
    button.classList.add('primary');
    button.textContent = channel === 'position' ? 'Position marked ✓' : 'Sound marked ✓';
    button.setAttribute('aria-pressed', 'true');
  }
  function nextTrial() {
    if (!alive || !running) return;
    trial++;
    if (trial >= n + scoredTrials) { complete(); return; }
    responded = { position: false, sound: false };
    const warmup = trial < n;
    [positionButton, soundButton].forEach(button => {
      button.disabled = warmup;
      button.classList.remove('primary');
      button.setAttribute('aria-pressed', 'false');
    });
    positionButton.textContent = 'Position · F';
    soundButton.textContent = 'Sound · J';
    ctx.setStatus(warmup ? 'Warm-up ' + (trial + 1) + ' of ' + n : 'Step ' + (trial - n + 1) + ' of ' + scoredTrials + ' · ' + n + '-back');
    ctx.setHint(warmup ? 'Remember this position and sound. Responses begin after warm-up.' : 'Compare with ' + n + ' steps earlier. Mark each matching channel.');
    cells.forEach((cell, i) => cell.classList.toggle('lit', i === positions[trial]));
    ctx.audio(sounds[trial], mode);
    const currentTrial = trial;
    ctx.timeout(function () {
      if (alive && running && trial === currentTrial) cells.forEach(cell => cell.classList.remove('lit'));
    }, 650);
    ctx.timeout(function () {
      if (!alive || !running || trial !== currentTrial) return;
      if (!warmup) {
        ['position', 'sound'].forEach(function (channel) {
          const sequence = channel === 'position' ? positions : sounds;
          const target = sequence[trial] === sequence[trial - n];
          const result = target ? (responded[channel] ? 'hit' : 'miss') : (responded[channel] ? 'falseAlarm' : 'correctRejection');
          stats[channel][result]++;
        });
        ctx.setProgress(trial - n + 1, scoredTrials);
      }
      nextTrial();
    }, 2500);
  }
  function complete() {
    running = false;
    if (!alive) return;
    alive = false;
    const balanced = s => 50 * (s.hit / (s.hit + s.miss) + s.correctRejection / (s.correctRejection + s.falseAlarm));
    const positionScore = balanced(stats.position);
    const soundScore = balanced(stats.sound);
    const accuracy = (positionScore + soundScore) / 2;
    const formatStats = s => s.hit + ' hits · ' + s.miss + ' misses · ' + s.falseAlarm + ' false alarms · ' + s.correctRejection + ' correct rejections';
    ctx.finish({
      accuracy: accuracy, variant: mode,
      correct: stats.position.hit + stats.position.correctRejection + stats.sound.hit + stats.sound.correctRejection,
      total: scoredTrials * 2,
      metric: 'Balanced accuracy', value: Math.round(accuracy) + '%',
      details: [
        { label: 'Level', value: n + '-back · ' + (mode === 'voice' ? 'spoken letters' : 'musical tones') },
        { label: 'Position · ' + Math.round(positionScore) + '%', value: formatStats(stats.position) },
        { label: 'Sound · ' + Math.round(soundScore) + '%', value: formatStats(stats.sound) },
        { label: 'How scoring works', value: 'For each channel, average the match hit rate and the nonmatch rejection rate. Then average both channels. Making no responses scores 50%.' }
      ],
      summary: 'You completed ' + n + '-back. This score measures performance on this practice task; it is not an IQ score.'
    });
  }
};

TASKS.corsi = function (ctx) {
  const length = Math.max(3, Math.min(10, Math.round(ctx.level || 1) + 2));
  const rounds = 5;
  let alive = true, phase = 'ready', round = 0, sequence = [], response = [], correct = 0;
  const outcomes = [];
  ctx.onCleanup(function () { alive = false; phase = 'closed'; });
  ctx.setStatus('Spatial span · ' + length + ' positions');
  ctx.setProgress(0, rounds);
  ctx.setHint('Watch a sequence, then tap it back in the same order.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Follow the path.</strong><p>Watch ' + length + ' tiles light up one at a time. After they finish, tap the same tiles in the same order. Tiles can appear more than once.</p><p>Practice has 5 rounds. A round counts as correct only when the complete sequence matches.</p></div>';
  ctx.button('Begin spatial span', start, { primary: true });
  let cells, footer;
  function start() {
    if (!alive || phase !== 'ready') return;
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="task-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:14px auto">' + Array.from({ length: 9 }, (_, i) => '<button class="tile" style="aspect-ratio:1;border-radius:18px;font-size:1.15rem" aria-label="Tile ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div><p class="task-note" style="text-align:center" id="spatial-input-status"></p>';
    cells = Array.from(ctx.stage.querySelectorAll('.tile'));
    footer = ctx.stage.querySelector('#spatial-input-status');
    cells.forEach((cell, index) => ctx.listen(cell, 'click', () => choose(index)));
    nextRound();
  }
  function nextRound() {
    if (!alive) return;
    round++;
    phase = 'show';
    response = [];
    sequence = [];
    while (sequence.length < length) {
      const value = Math.floor(Math.random() * 9);
      if (!sequence.length || value !== sequence[sequence.length - 1]) sequence.push(value);
    }
    ctx.controls.innerHTML = '';
    ctx.setStatus('Round ' + round + ' of ' + rounds + ' · watch');
    ctx.setHint('Remember the order. Wait until the sequence ends.');
    footer.textContent = length + ' positions to remember';
    cells.forEach(cell => { cell.disabled = true; cell.classList.remove('lit'); });
    sequence.forEach(function (tile, index) {
      ctx.timeout(function () {
        if (alive && phase === 'show') cells[tile].classList.add('lit');
      }, 500 + index * 850);
      ctx.timeout(function () {
        if (alive && phase === 'show') cells[tile].classList.remove('lit');
      }, 1050 + index * 850);
    });
    ctx.timeout(function () {
      if (!alive || phase !== 'show') return;
      phase = 'recall';
      cells.forEach(cell => { cell.disabled = false; cell.classList.remove('lit'); });
      ctx.setStatus('Round ' + round + ' of ' + rounds + ' · your turn');
      ctx.setHint('Tap the tiles in the same order.');
      footer.textContent = '0 of ' + length + ' entered';
      ctx.button('Clear taps', function () {
        if (phase !== 'recall') return;
        response = [];
        footer.textContent = '0 of ' + length + ' entered';
      });
    }, 500 + length * 850);
  }
  function choose(index) {
    if (!alive || phase !== 'recall') return;
    response.push(index);
    footer.textContent = response.length + ' of ' + length + ' entered';
    cells[index].classList.add('lit');
    ctx.timeout(() => { if (alive && phase === 'recall') cells[index].classList.remove('lit'); }, 130);
    if (response.length === length) grade();
  }
  function grade() {
    phase = 'feedback';
    const passed = sequence.every((value, i) => value === response[i]);
    if (passed) correct++;
    outcomes.push(passed);
    ctx.setProgress(round, rounds);
    cells.forEach(cell => { cell.disabled = true; cell.classList.remove('lit'); });
    ctx.controls.innerHTML = '';
    ctx.setStatus(passed ? 'Sequence correct' : 'Sequence complete');
    ctx.setHint(passed ? 'You reproduced all ' + length + ' positions.' : 'Keep practicing the order. The next round uses a fresh sequence.');
    footer.textContent = passed ? '✓ ' + response.map(i => i + 1).join(' → ') : 'Your taps: ' + response.map(i => i + 1).join(' → ') + ' · Sequence: ' + sequence.map(i => i + 1).join(' → ');
    ctx.button(round === rounds ? 'See results' : 'Next round', function () {
      if (!alive || phase !== 'feedback') return;
      if (round < rounds) nextRound();
      else {
        alive = false;
        phase = 'closed';
        ctx.finish({ accuracy: correct / rounds * 100, correct: correct, total: rounds, metric: 'Sequences recalled', value: correct + ' / ' + rounds,
          details: [{ label: 'Span practiced', value: length + ' positions, forward order' }, { label: 'Rounds', value: outcomes.map((passed, i) => (i + 1) + ': ' + (passed ? 'correct' : 'missed')).join(' · ') }],
          summary: 'You recalled ' + correct + ' complete sequences. This is a practice score, not a clinical memory assessment.' });
      }
    }, { primary: true });
  }
};

TASKS.digits = function (ctx) {
  const length = Math.max(3, Math.min(10, Math.round(ctx.level || 1) + 2));
  const rounds = 5;
  let alive = true, phase = 'ready', round = 0, sequence = [], response = '', correct = 0;
  const outcomes = [];
  ctx.onCleanup(function () { alive = false; phase = 'closed'; });
  ctx.setStatus('Reverse digit span · ' + length + ' digits');
  ctx.setProgress(0, rounds);
  ctx.setHint('Remember the numbers, then enter them in reverse order.');
  ctx.stage.innerHTML = '<div class="task-note"><strong>Hold it, then reverse it.</strong><p>Watch ' + length + ' digits, one at a time. When the sequence ends, enter the digits backwards. For 3, 7, 2, you would enter 2, 7, 3.</p><p>Practice has 5 rounds. Your score counts complete sequences recalled correctly.</p></div>';
  ctx.button('Begin reverse digits', nextRound, { primary: true });
  let display, input, digitButtons, submit;
  function nextRound() {
    if (!alive || (phase !== 'ready' && phase !== 'feedback')) return;
    round++;
    phase = 'show';
    response = '';
    sequence = Array.from({ length: length }, () => Math.floor(Math.random() * 10));
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="stimulus" style="min-height:150px;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:600;font-variant-numeric:tabular-nums" aria-live="polite">Ready</div><p class="task-note" style="text-align:center">Watch every digit. Recall comes next.</p>';
    display = ctx.stage.querySelector('.stimulus');
    ctx.setStatus('Round ' + round + ' of ' + rounds + ' · watch');
    ctx.setHint('Remember ' + length + ' digits, then reverse their order.');
    sequence.forEach(function (digit, index) {
      ctx.timeout(function () { if (alive && phase === 'show') display.textContent = digit; }, 600 + index * 1100);
      ctx.timeout(function () { if (alive && phase === 'show') display.textContent = ''; }, 1400 + index * 1100);
    });
    ctx.timeout(recall, 600 + length * 1100);
  }
  function recall() {
    if (!alive || phase !== 'show') return;
    phase = 'recall';
    ctx.stage.innerHTML = '<label class="prompt" for="reverse-digit-input">Enter the digits backwards</label><input class="choice" id="reverse-digit-input" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="' + length + '" aria-describedby="reverse-digit-count" style="width:100%;font-size:2rem;text-align:center;letter-spacing:.15em;font-variant-numeric:tabular-nums"><p class="task-note" id="reverse-digit-count" style="text-align:center">0 of ' + length + ' digits entered</p><div class="answer-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:310px;margin:14px auto">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'Clear'].map(digit => '<button class="choice" type="button" data-digit="' + digit + '" style="min-height:48px;font-size:1.15rem">' + digit + '</button>').join('') + '</div>';
    input = ctx.stage.querySelector('input');
    digitButtons = Array.from(ctx.stage.querySelectorAll('[data-digit]'));
    const count = ctx.stage.querySelector('#reverse-digit-count');
    function update() {
      input.value = response;
      count.textContent = response.length + ' of ' + length + ' digits entered';
      submit.disabled = response.length !== length;
    }
    digitButtons.forEach(button => ctx.listen(button, 'click', function () {
      if (!alive || phase !== 'recall') return;
      const value = button.dataset.digit;
      if (value === '⌫') response = response.slice(0, -1);
      else if (value === 'Clear') response = '';
      else if (response.length < length) response += value;
      update();
    }));
    ctx.listen(input, 'input', function () {
      if (!alive || phase !== 'recall') return;
      response = input.value.replace(/[^0-9]/g, '').slice(0, length);
      update();
    });
    ctx.listen(input, 'keydown', function (event) { if (event.key === 'Enter' && response.length === length) { event.preventDefault(); grade(); } });
    submit = ctx.button('Check sequence', grade, { primary: true });
    submit.disabled = true;
    ctx.setStatus('Round ' + round + ' of ' + rounds + ' · your turn');
    ctx.setHint('Enter the last digit first, working back to the first.');
  }
  function grade() {
    if (!alive || phase !== 'recall' || response.length !== length) return;
    phase = 'feedback';
    const expected = sequence.slice().reverse().join('');
    const passed = response === expected;
    if (passed) correct++;
    outcomes.push(passed);
    ctx.setProgress(round, rounds);
    ctx.controls.innerHTML = '';
    ctx.stage.innerHTML = '<div class="task-note"><strong>' + (passed ? 'Sequence correct' : 'Sequence complete') + '</strong><p>Your answer: <span style="font-variant-numeric:tabular-nums;letter-spacing:.12em">' + response + '</span></p><p>Reverse sequence: <span style="font-variant-numeric:tabular-nums;letter-spacing:.12em">' + expected + '</span></p></div>';
    ctx.setStatus(passed ? 'All ' + length + ' digits correct' : 'Keep practicing');
    ctx.setHint(passed ? 'You reversed the entire sequence.' : 'Try grouping a few digits together as you remember them.');
    ctx.button(round === rounds ? 'See results' : 'Next round', function () {
      if (!alive || phase !== 'feedback') return;
      if (round < rounds) nextRound();
      else {
        alive = false;
        phase = 'closed';
        ctx.finish({ accuracy: correct / rounds * 100, correct: correct, total: rounds, metric: 'Sequences recalled', value: correct + ' / ' + rounds,
          details: [{ label: 'Span practiced', value: length + ' digits, reverse order' }, { label: 'Rounds', value: outcomes.map((passed, i) => (i + 1) + ': ' + (passed ? 'correct' : 'missed')).join(' · ') }],
          summary: 'You recalled ' + correct + ' complete reversed sequences. This is a practice score, not a clinical memory assessment.' });
      }
    }, { primary: true });
  }
};

/* Attention and control exercises. These are practice tasks, not diagnostic tests. */
(() => {

      ctx.stage.append(element('p', 'What comes next?', 'prompt'));
      const stimulus = element('div', `${trial.shown.join('  ·  ')}  ·  ?`, 'stimulus');
      stimulus.style.cssText = 'font-size:clamp(1.15rem,5vw,1.65rem);line-height:1.7;overflow-wrap:anywhere;letter-spacing:0';
      ctx.stage.append(stimulus);
      choices(ctx, numericChoices(trial.answer), (answer, button) => {
        const success = answer === trial.answer;
        if (success) correct++;
        button.style.background = success ? '#d4e9e2' : '#f7e0ce';
        note(ctx, `${success ? 'Correct.' : `The answer is ${trial.answer}.`} ${trial.rule}`);
        ctx.setHint('One point for each correct first answer.');
        index++;
        ctx.setProgress(index, total);
        ctx.button(index === total ? 'See results' : 'Next pattern', next, { primary: true });
      });
    };
    showIntro(ctx, 'Find the pattern', 'Twelve number sequences, four choices each. After each answer you will see the intended rule. There is no time pressure; the score counts your first answer to each pattern.', 'Begin patterns', next);
    ctx.setStatus('12 patterns · untimed');
    ctx.setHint('Practice a reasoning skill. Improvement on this task does not establish a general intelligence gain.');
    ctx.setProgress(0, total);
  };

  const normalizeCells = cells => {
    const minX = Math.min(...cells.map(c => c[0])), minY = Math.min(...cells.map(c => c[1]));
    return cells.map(([x, y]) => [x - minX, y - minY]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const signature = cells => JSON.stringify(normalizeCells(cells));
  const rotateCells = cells => cells.map(([x, y]) => [-y, x]);
  const isChiral = cells => {
    const original = signature(cells);
    let reflected = cells.map(([x, y]) => [-x, y]);
    for (let i = 0; i < 4; i++) {
      if (signature(reflected) === original) return false;
      reflected = rotateCells(reflected);
    }
    return true;
  };
  const makeShape = size => {
    for (let attempt = 0; attempt < 200; attempt++) {
      const cells = [[0, 0]], occupied = new Set(['0,0']);
      let tries = 0;
      while (cells.length < size && tries++ < 300) {
        const [x, y] = cells[random(0, cells.length - 1)];
        const [dx, dy] = [[1, 0], [-1, 0], [0, 1], [0, -1]][random(0, 3)];
        const key = `${x + dx},${y + dy}`;
        if (!occupied.has(key)) { cells.push([x + dx, y + dy]); occupied.add(key); }
      }
      if (cells.length === size && isChiral(cells)) return normalizeCells(cells);
    }
    return [[0, 0], [0, 1], [0, 2], [1, 2], [1, 3]];
  };
  const shapeSVG = (cells, angle, mirrored, label) => {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 220 220');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', label);
    svg.style.cssText = 'display:block;width:100%;max-height:220px';
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const centerX = (Math.min(...xs) + Math.max(...xs) + 1) / 2;
    const centerY = (Math.min(...ys) + Math.max(...ys) + 1) / 2;
    const radius = Math.max(...cells.flatMap(([x, y]) => [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]].map(([cx, cy]) => Math.hypot(cx - centerX, cy - centerY))));
    const scale = 84 / radius;
    const group = document.createElementNS(svgNS, 'g');
    group.setAttribute('transform', `translate(110 110) rotate(${angle}) scale(${mirrored ? -1 : 1} 1)`);
    cells.forEach(([x, y]) => {
      const rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', String((x - centerX) * scale));
      rect.setAttribute('y', String((y - centerY) * scale));
      rect.setAttribute('width', String(scale + 0.2));
      rect.setAttribute('height', String(scale + 0.2));
      rect.setAttribute('fill', '#296b61');
      group.append(rect);
    });
    svg.append(group);
    return svg;
  };

  TASKS.rotation = ctx => {
    let index = 0, correct = 0;
    const total = 12;
    const mirrors = shuffle(Array.from({ length: total }, (_, i) => i < total / 2));
    const next = () => {
      if (index === total) {
        ctx.finish({ accuracy: percent(correct, total), correct, total, metric: 'Shapes compared', value: `${correct} / ${total}`, details: [{ label: 'First answers', value: `${percent(correct, total)}% correct` }, { label: 'Shape complexity', value: `${5 + Math.floor((ctx.level - 1) / 2)} blocks` }], summary: 'You practiced recognizing rotated shapes and distinguishing mirror images. This score describes spatial-task performance.' });
        return;
      }
      clear(ctx);
      ctx.setStatus(`Comparison ${index + 1} of ${total}`);
      ctx.setProgress(index, total);
      ctx.setHint('Rotate the left shape in your mind. You cannot turn it over.');
      const cells = makeShape(5 + Math.floor((ctx.level - 1) / 2));
      const angle = ctx.level < 3 ? [90, 180, 270][random(0, 2)] : ctx.level < 6 ? [45, 90, 135, 180, 225, 270, 315][random(0, 6)] : random(1, 23) * 15;
      const mirrored = mirrors[index];
      ctx.stage.append(element('p', 'Same shape, or a mirror image?', 'prompt'));
      const grid = element('div', undefined, 'task-grid');
      grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:12px auto';
      ['Reference', 'Comparison'].forEach((label, i) => {
        const panel = element('div');
        panel.style.cssText = 'border:1px solid #d8ddd6;border-radius:16px;padding:8px;background:#fffdf7;min-width:0;text-align:center';
        panel.append(element('span', label, 'task-note'), shapeSVG(cells, i ? angle : 0, i ? mirrored : false, `${label} block shape`));
        grid.append(panel);
      });
      ctx.stage.append(grid);
      choices(ctx, ['Same rotated shape', 'Mirror image'], (answer, button) => {
        const expected = mirrored ? 'Mirror image' : 'Same rotated shape';
        const success = answer === expected;
        if (success) correct++;
        button.style.background = success ? '#d4e9e2' : '#f7e0ce';
        note(ctx, `${success ? 'Correct.' : `${expected}.`} ${mirrored ? 'The comparison was reflected and then rotated. Rotation alone cannot match it.' : `The comparison is the reference rotated ${angle}°. No reflection was used.`}`);
        index++;
        ctx.setProgress(index, total);
        ctx.button(index === total ? 'See results' : 'Next shapes', next, { primary: true });
      });
    };
    showIntro(ctx, 'Turn it in your mind', 'Compare twelve pairs of shapes. Decide whether the right shape is a rotation of the left, or its mirror image. The shapes are deliberately asymmetric, so each answer is definite. Take your time.', 'Begin comparisons', next);
    ctx.setStatus('12 comparisons · untimed');
    ctx.setHint('One point per correct first answer. The two answer types occur equally often.');
    ctx.setProgress(0, total);
  };

  const pairBank = [
    ['Lantern', 'Otter'], ['Anchor', 'Cinnamon'], ['Violin', 'Pebble'], ['Helmet', 'Tulip'],
    ['Pillow', 'Copper'], ['Ladder', 'Mango'], ['Compass', 'Velvet'], ['Basket', 'Comet'],
    ['Window', 'Badger'], ['Ribbon', 'Volcano'], ['Fountain', 'Walnut'], ['Kettle', 'Orchid'],
    ['Castle', 'Sparrow'], ['Envelope', 'Coral'], ['Bicycle', 'Nutmeg'], ['Boot', 'Galaxy'],
    ['Candle', 'Beetle'], ['Spoon', 'Meadow'], ['Mirror', 'Acorn'], ['Drum', 'Quartz'],
    ['Notebook', 'Falcon'], ['Bridge', 'Papaya'], ['Scarf', 'Meteor'], ['Saddle', 'Fern']
  ];

  TASKS.pairs = ctx => {
    const total = 6 + Math.round((ctx.level - 1) * 4 / 7);
    const pairs = shuffle(pairBank).slice(0, total);
    const order = shuffle(pairs);
    let index = 0, correct = 0;
    const recall = () => {
      if (index === total) {
        ctx.finish({ accuracy: percent(correct, total), correct, total, metric: 'Pairs recalled', value: `${correct} / ${total}`, details: [{ label: 'First answers', value: `${percent(correct, total)}% correct` }, { label: 'Pairs studied', value: String(total) }], summary: 'You practiced learning associations between words. Multiple-choice answers measure cued recognition, which is easier than recalling an answer without choices.' });
        return;
      }
      clear(ctx);
      ctx.setStatus(`Recall ${index + 1} of ${total}`);
      ctx.setHint('Choose the word that was paired with this cue.');
      ctx.setProgress(index, total);
      const [cue, target] = order[index];
      ctx.stage.append(element('p', 'Which word goes with…', 'prompt'), element('div', cue, 'stimulus'));
      const distractors = shuffle(pairs.map(p => p[1]).filter(word => word !== target)).slice(0, 3);
      choices(ctx, shuffle([target, ...distractors]), (answer, button) => {
        const success = answer === target;
        if (success) correct++;
        button.style.background = success ? '#d4e9e2' : '#f7e0ce';
        note(ctx, `${success ? 'Correct.' : 'Study the correct pair:'} ${cue} ↔ ${target}`);
        index++;
        ctx.setProgress(index, total);
        ctx.button(index === total ? 'See results' : 'Next pair', recall, { primary: true });
      });
    };
    const study = () => {
      clear(ctx);
      ctx.setStatus(`Study ${total} pairs`);
      ctx.setHint('Make a vivid mental image connecting the two words. Study at your own pace.');
      ctx.stage.append(element('h3', 'Make a connection', 'prompt'));
      const grid = element('div');
      grid.style.cssText = 'display:grid;gap:8px;width:100%;max-width:480px;margin:16px auto';
      pairs.forEach(([a, b]) => {
        const row = element('div');
        row.style.cssText = 'display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;border:1px solid #d8ddd6;border-radius:12px;background:#fffdf7';
        row.append(element('strong', a), element('span', '↔'), element('strong', b));
        grid.append(row);
      });
      ctx.stage.append(grid);
      ctx.button('Ready to recall', recall, { primary: true });
    };
    showIntro(ctx, 'Remember the connection', `Study ${total} unrelated word pairs, then retrieve each partner from four choices. A vivid image connecting the words can help. Each pair is scored once, on your first answer.`, 'Study word pairs', study);
    ctx.setStatus(`${total} pairs · untimed`);
    ctx.setHint('Practice association learning. These words are practice material, not a standardized memory assessment.');
    ctx.setProgress(0, total);
  };

  const facts = [
    { id: 'water', question: 'At sea level, what is the boiling point of pure water?', answer: '100 °C', wrong: ['90 °C', '110 °C', '120 °C'], explanation: 'At standard atmospheric pressure, pure water boils at 100 °C. Lower pressure lowers the boiling point.' },
    { id: 'earth', question: 'Approximately how long does Earth take to orbit the Sun?', answer: '365.25 days', wrong: ['24 days', '180 days', '730 days'], explanation: 'Earth takes roughly 365.25 days to complete an orbit. Leap years help keep the calendar aligned with the seasons.' },
    { id: 'light', question: 'Approximately how fast does light travel in a vacuum?', answer: '300,000 km/s', wrong: ['300 km/s', '3,000 km/s', '30,000 km/s'], explanation: 'The exact speed of light in a vacuum is 299,792.458 kilometres per second.' },
    { id: 'photosynthesis', question: 'Which gas do plants take in during photosynthesis?', answer: 'Carbon dioxide', wrong: ['Oxygen', 'Hydrogen', 'Helium'], explanation: 'Photosynthesis uses carbon dioxide and water, with energy from light, to produce sugars and release oxygen.' },
    { id: 'angle', question: 'What is the sum of the interior angles of a triangle on a flat plane?', answer: '180°', wrong: ['90°', '270°', '360°'], explanation: 'The three interior angles of a triangle in Euclidean geometry add up to 180°.' },
    { id: 'percent', question: 'What is 15% of 200?', answer: '30', wrong: ['15', '20', '35'], explanation: '15% means 15 out of 100. Multiplying 200 by 0.15 gives 30.' },
    { id: 'density', question: 'How do you calculate density?', answer: 'Mass divided by volume', wrong: ['Volume divided by mass', 'Mass multiplied by volume', 'Mass divided by area'], explanation: 'Density is mass per unit volume. For example, kilograms per cubic metre.' },
    { id: 'metric', question: 'How many millilitres are in one litre?', answer: '1,000', wrong: ['10', '100', '10,000'], explanation: 'The prefix milli- means one thousandth, so one litre contains 1,000 millilitres.' },
    { id: 'correlation', question: 'What does correlation alone establish?', answer: 'An association between variables', wrong: ['That one variable causes the other', 'That neither variable has a cause', 'That the association cannot be coincidence'], explanation: 'Correlation describes an association. Establishing causation requires further evidence, including attention to confounding and direction.' },
    { id: 'mean', question: 'How do you calculate the arithmetic mean?', answer: 'Add the values, then divide by their count', wrong: ['Select the middle value after sorting', 'Select the most frequent value', 'Subtract the smallest value from the largest'], explanation: 'The arithmetic mean is the sum divided by the number of values. The other choices describe the median, mode, and range.' },
    { id: 'half', question: 'After two half-lives, what fraction of an initial radioactive sample remains undecayed?', answer: 'One quarter', wrong: ['One half', 'One eighth', 'Three quarters'], explanation: 'Each half-life halves the remaining amount: 1 → ½ → ¼.' },
    { id: 'byte', question: 'How many bits are in one byte?', answer: '8', wrong: ['2', '4', '16'], explanation: 'A modern byte consists of eight bits. Each bit represents a binary value, 0 or 1.' }
  ];

  TASKS.retrieval = ctx => {
    const day = 24 * 60 * 60 * 1000;
    const intervals = [1, 3, 7, 14, 30];
    const root = ctx.state.taskData || (ctx.state.taskData = {});
    const saved = root.retrieval || (root.retrieval = { cards: {} });
    if (!saved.cards || typeof saved.cards !== 'object' || Array.isArray(saved.cards)) saved.cards = {};
    const now = Date.now();
    const validRecord = card => {
      const record = saved.cards[card.id];
      return record && Number.isFinite(record.due) && Number.isInteger(record.streak) && record.streak >= 0;
    };
    const newCards = facts.filter(card => !validRecord(card));
    const dueCards = facts.filter(card => validRecord(card) && saved.cards[card.id].due <= now);
    let practice = false, index = 0, correct = 0, items = [], reviewed = 0;
    const dateLabel = timestamp => new Date(timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const nextDue = () => {
      const times = facts.filter(validRecord).map(card => saved.cards[card.id].due);
      return times.length ? Math.min(...times) : null;
    };
    const recall = () => {
      if (index === items.length) {
        const due = nextDue();
        ctx.finish({ accuracy: percent(correct, items.length), correct, total: items.length, metric: practice ? 'Practice accuracy' : 'Cued retrieval', value: `${correct} / ${items.length}`, details: [{ label: 'Answers', value: 'Multiple-choice recognition' }, { label: practice ? 'Schedule' : 'Cards scheduled', value: practice ? 'Unchanged during extra practice' : String(reviewed) }, { label: 'Next review', value: due ? dateLabel(due) : 'Not scheduled' }], summary: practice ? 'This was extra practice. Existing review dates and interval streaks were unchanged.' : 'Correct answers expand the interval to 1, 3, 7, 14, then 30 days. An incorrect answer returns tomorrow. Spacing and retrieval improve retention of studied material; this score is not a measure of general cognition.' });
        return;
      }
      clear(ctx);
      const card = items[index];
      ctx.setStatus(`${practice ? 'Extra practice' : 'Review'} ${index + 1} of ${items.length}`);
      ctx.setProgress(index, items.length);
      ctx.setHint('Try to recall the answer before reading the choices.');
      ctx.stage.append(element('p', card.question, 'prompt'));
      choices(ctx, shuffle([card.answer, ...card.wrong]), (answer, button) => {
        const success = answer === card.answer;
        if (success) correct++;
        button.style.background = success ? '#d4e9e2' : '#f7e0ce';
        let schedule = '';
        if (!practice) {
          const previous = validRecord(card) ? saved.cards[card.id] : { streak: 0 };
          const streak = success ? Math.min(previous.streak + 1, intervals.length) : 0;
          const days = success ? intervals[Math.max(0, streak - 1)] : 1;
          saved.cards[card.id] = { streak, due: Date.now() + days * day, lastReviewed: Date.now() };
          reviewed++;
          schedule = ` Next review: ${days === 1 ? 'tomorrow' : `in ${days} days`}.`;
        }
        note(ctx, `${success ? 'Correct.' : `Answer: ${card.answer}.`} ${card.explanation}${schedule}`);
        if (practice) note(ctx, 'Extra practice leaves the spaced-review schedule unchanged.');
        index++;
        ctx.setProgress(index, items.length);
        ctx.button(index === items.length ? 'See results' : 'Next card', recall, { primary: true });
      });
    };
    const begin = optionalPractice => {
      practice = optionalPractice;
      index = 0;
      correct = 0;
      reviewed = 0;
      items = shuffle(practice ? facts : [...newCards, ...dueCards]);
      if (!items.length) return;
      if (practice || !newCards.length) { recall(); return; }
      clear(ctx);
      ctx.setStatus(`Study ${newCards.length} new cards`);
      ctx.setHint('Read each answer, then look away and try to say it from memory.');
      ctx.stage.append(element('h3', 'Learn something worth remembering', 'prompt'));
      const list = element('div');
      list.style.cssText = 'display:grid;gap:12px;width:100%;max-width:580px;margin:16px auto';
      newCards.forEach(card => {
        const panel = element('div');
        panel.style.cssText = 'border:1px solid #d8ddd6;border-radius:14px;padding:16px;background:#fffdf7;text-align:left';
        panel.append(element('p', card.question), element('strong', card.answer), element('p', card.explanation, 'task-note'));
        list.append(panel);
      });
      ctx.stage.append(list);
      ctx.button('Ready to retrieve', recall, { primary: true });
    };
    clear(ctx);
    ctx.stage.append(element('h3', 'Remember it for longer', 'prompt'));
    note(ctx, 'Learn twelve useful facts, then revisit them on an expanding schedule: 1, 3, 7, 14, and 30 days. Reviews use multiple-choice cued retrieval; recalling an answer without choices is a stronger test, so try that first.');
    note(ctx, 'Review dates are saved in this browser. New cards are studied before their first quiz. An incorrect answer is explained and returns tomorrow.');
    const count = newCards.length + dueCards.length;
    ctx.setProgress(0, count || facts.length);
    if (count) {
      ctx.setStatus(`${newCards.length} new · ${dueCards.length} due`);
      ctx.setHint('Only new and due cards enter the scheduled session.');
      note(ctx, `Today: ${newCards.length} new ${newCards.length === 1 ? 'card' : 'cards'} and ${dueCards.length} due for review.`);
      ctx.button(newCards.length ? 'Study and review' : 'Begin due review', () => begin(false), { primary: true });
    } else {
      const next = nextDue();
      ctx.setStatus('All cards up to date');
      ctx.setHint('Your next scheduled review is waiting. Extra practice does not advance the intervals.');
      note(ctx, `No cards are due. Next scheduled review: ${next ? dateLabel(next) : 'not scheduled'}.`);
      ctx.button('Extra practice · schedule unchanged', () => begin(true));
    }
  };
})();

navigate('practice');
</script>
</body>
</html>
