    :root{--paper:#f7f8fa;--white:#fff;--ink:#253037;--muted:#7b848c;--purple:#7160d6;--purple-soft:#f0edfb;--teal:#189a82;--line:#e5e8ec;--sans:'DM Sans',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans)}button,input,select{font:inherit}button,a,summary,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}a{color:var(--purple);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #baaff3;outline-offset:4px}::selection{background:#ded8fb}svg text{font-family:var(--sans)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.skip-link{position:fixed;top:-60px;left:20px;z-index:100;background:white;padding:12px}.skip-link:focus{top:12px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:252px;padding:31px 23px 22px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}.brand:hover{text-decoration:none}.brand-icon{width:36px;height:38px}.brand-name{font:500 20px/1.08 var(--serif);letter-spacing:-.6px}.brand-note{font-size:9px;letter-spacing:2px;color:var(--muted);margin:12px 0 0 47px}.chapter-label{margin:40px 9px 14px;display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1.8px;color:var(--muted)}.chapter-label span:last-child{font-size:9px;letter-spacing:.5px;background:#f4f5f7;border-radius:4px;padding:2px 6px}.lesson-nav{display:flex;flex-direction:column;gap:5px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;color:#717c85;padding:11px 12px;border-radius:7px;font-size:12px;line-height:1.3;position:relative}.nav-item:hover{background:#f7f8fa;color:var(--ink)}.nav-item.active{background:var(--purple-soft);color:var(--purple);font-weight:600}.nav-number{font-size:10px;opacity:.65;min-width:17px}.nav-check{margin-left:auto;color:var(--teal);font-size:13px}.nav-item.active:before{content:'';position:absolute;left:-23px;width:3px;height:22px;background:var(--purple);border-radius:0 3px 3px 0}.sidebar-bottom{margin-top:auto;padding-top:28px}.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.progress-track{height:3px;background:#ebedf1;border-radius:4px;margin:9px 0 17px;overflow:hidden}.progress-fill{height:100%;background:var(--teal);transition:width .4s}.sidebar-foot{font-size:10px;color:#9aa1a7;border-top:1px solid var(--line);padding-top:17px}.sidebar-foot a{color:#7b848c}.side-flower{float:right;width:18px;color:var(--purple)}
    .workspace{margin-left:252px}.topbar{height:76px;padding:0 48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(247,248,250,.92)}.breadcrumb{font-size:11px;color:#939ba2;display:flex;gap:12px;align-items:center}.breadcrumb b{font-weight:500;color:#65717b}.breadcrumb svg{width:13px;opacity:.6}.top-actions{display:flex;align-items:center;gap:25px}.search-trigger{display:flex;align-items:center;gap:9px;border:0;background:none;color:#7c8690;font-size:11px;padding:6px}.search-trigger svg{width:15px;height:15px}.keycap{border:1px solid #dfe3e8;border-radius:4px;font-size:10px;padding:0 5px;color:#929ba3}.about-trigger{border:0;background:none;font-size:11px;color:#7c8690;padding:5px}.mobile-menu{display:none;border:0;background:transparent;font-size:20px}.main{max-width:1320px;margin:auto;padding:40px 48px 28px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:center;margin-bottom:30px}.eyebrow{font-size:10px;color:var(--purple);letter-spacing:2px;font-weight:600;display:flex;align-items:center;gap:9px;margin:0 0 15px}.eyebrow:before{content:'';width:6px;height:6px;background:var(--purple);border-radius:50%}.hero h1{font:400 clamp(35px,3.7vw,54px)/1.1 var(--serif);letter-spacing:-1.8px;margin:0 0 17px;max-width:690px}.hero h1 em{color:var(--purple);font-weight:400;font-style:normal}.hero-description{color:#7a838c;max-width:590px;font-size:13px;line-height:1.8;margin:0}.hero-art{min-width:148px;width:166px;height:148px;position:relative;opacity:.9}.hero-art svg{width:100%;height:100%}.hero-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 42px var(--serif);color:var(--purple)}

  <script>
/* Original study companion. Coverage checked against the author's sixth-edition Chapter 1 preview. */
window.CHAPTER_DATA = {
  editionNote: "An original, interactive companion to Chapter 1, ‘The Basics’, in Reinhard Diestel’s Graph Theory, sixth edition (2025). It follows all ten sections, adds proof ideas, and includes the named extensions in the exercises and notes. Graphs are finite, simple, and undirected unless stated otherwise. This is a study guide, not a reproduction of the chapter or its exercises.",
  sources: [
    { title: "Author’s official preview · sixth edition", url: "https://diestel-graph-theory.com/basic.html" },
    { title: "Chapter 1 · The Basics (official PDF)", url: "https://www.math.uni-hamburg.de/home/diestel/books/graph.theory/preview/Ch1.pdf" },
    { title: "Official table of contents", url: "https://www.math.uni-hamburg.de/home/diestel/books/graph.theory/preview/Contents.pdf" }
  ],
  sections: [
    {
      id: "graphs", number: "1.1", title: "Graphs", kicker: "The language of connections",
      description: "A graph records which pairs belong together. Its geometry is a drawing choice; its mathematical identity is the pattern of adjacency. Build the vocabulary that every later section uses.",
      concepts: [
        { name: "Vertices, edges, and a simple graph", explanation: "A graph G=(V,E) has a set of vertices and a set of unordered pairs of distinct vertices called edges. An edge xy is the same as yx. This definition excludes loops and repeated edges; line crossings do not create vertices unless explicitly marked.", formula: "G = (V, E),  E ⊆ [V]²", visual: "graph" },
        { name: "Order, size, finite graphs, and trivial graphs", explanation: "The order n is the number of vertices; the size m is the number of edges. Diestel writes these as |G| and ‖G‖. Finite, infinite, and countable refer to the vertex set. The empty graph has no vertices or edges; graphs of order zero or one are called trivial.", formula: "n = |V(G)| = |G|;  m = |E(G)| = ‖G‖", visual: "graph" },
        { name: "Incidence, ends, adjacency, and neighbours", explanation: "A vertex is incident with an edge when it is one of the edge’s ends. Vertices are adjacent when joined by an edge; two distinct edges are adjacent when they share an end. E(v) is the set of edges at v, and E(X,Y) collects edges between vertex sets X and Y.", visual: "degree" },
        { name: "Complete graphs and triangles", explanation: "A complete graph contains every possible pair of vertices as an edge. Diestel writes Kⁿ for the complete graph on n vertices; K³ is a triangle. Each edge is an unordered pair, so counting all pairs gives the edge count below.", formula: "|E(Kⁿ)| = n(n−1)/2", visual: "complete" },
        { name: "Independent or stable sets", explanation: "An independent vertex set has no edges within it; ‘stable set’ means the same thing. An independent edge set has no two edges sharing an end. These are different uses of independence: the objects being compared matter.", visual: "independent" },
        { name: "Homomorphisms", explanation: "A homomorphism maps vertices of one graph to another while preserving edges. It can merge nonadjacent vertices and need not preserve nonedges. In a simple target graph, adjacent vertices cannot merge because that would require a loop; each inverse image of a target vertex is therefore independent.", formula: "xy ∈ E(G) ⇒ φ(x)φ(y) ∈ E(H)", visual: "map" },
        { name: "Isomorphisms, automorphisms, and abstract graphs", explanation: "An isomorphism is a bijection preserving both adjacency and nonadjacency. Two drawings can represent isomorphic graphs despite looking very different. An automorphism is an isomorphism of a graph to itself. An abstract graph means the connection pattern considered independently of labels or drawings.", formula: "G ≅ H ⇔ xy ∈ E(G) exactly when φ(x)φ(y) ∈ E(H)", visual: "isomorphism" },
        { name: "Graph properties and invariants", explanation: "A graph property is unchanged by relabelling: containing a triangle is an example. An invariant assigns the same value to isomorphic graphs: order, size, and the largest number of pairwise adjacent vertices are examples. An invariant can help disprove isomorphism, though matching invariants need not prove it.", visual: "isomorphism" },
        { name: "Subgraphs, supergraphs, and proper subgraphs", explanation: "A subgraph chooses some of a graph’s vertices and some of the available edges between them. The larger graph is a supergraph. A proper subgraph is strictly smaller in this containment relation; it may have fewer vertices, fewer edges, or both.", formula: "H ⊆ G ⇔ V(H) ⊆ V(G) and E(H) ⊆ E(G)", visual: "subgraph" },
        { name: "Induced subgraphs", explanation: "An induced subgraph G[U] keeps a chosen vertex set U and every original edge between its vertices. Once U is fixed, no further edge choices remain. Saying ‘U induces’ or ‘U spans’ G[U] has this meaning. For a subgraph H, the abbreviation G[H] means G[V(H)].", formula: "E(G[U]) = {xy ∈ E(G) : x,y ∈ U}", visual: "induced" },
        { name: "Spanning subgraphs", explanation: "A spanning subgraph keeps all original vertices but may discard edges. Its defining condition is V(H)=V(G), not that all edges remain. A spanning tree is an important example. A graph can be both induced and spanning, but then it is the original graph itself.", formula: "H spans G ⇔ H ⊆ G and V(H)=V(G)", visual: "spanning" },
        { name: "Union, intersection, and disjoint graphs", explanation: "Graph union takes the union of both vertex sets and both edge sets; intersection takes both intersections. Two graphs are disjoint when their vertex sets do not overlap. These operations use actual vertex labels, so the way graphs overlap must be specified first.", formula: "G ∪ H = (V(G) ∪ V(H), E(G) ∪ E(H))", visual: "union" },
        { name: "Deleting vertices, deleting edges, and adding edges", explanation: "Deleting a vertex also deletes every incident edge. Deleting an edge keeps its ends. For vertex set U, G−U is induced on the remaining vertices; for edge set F, G−F removes just those edges. G+F adds specified edges on the existing vertex set. G−H abbreviates deletion of V(H).", visual: "delete" },
        { name: "Minimal, maximal, maximum, and edge-maximal", explanation: "Minimal and maximal mean no smaller or larger object by inclusion has the stated property. They do not mean fewest or most elements. An edge-maximal graph with a property has no strict edge superset on its fixed vertex set that also has the property. A maximum independent set has largest size; a maximal one merely cannot be enlarged.", visual: "maximal" },
        { name: "The join of two graphs", explanation: "The join G∗H starts with two disjoint graphs and adds every possible edge between their vertex sets. Their internal edges stay in place. For example, joining K² to K³ produces K⁵. Joining independent sets produces complete multipartite graphs.", formula: "G∗H = G ∪ H plus all V(G)–V(H) edges", visual: "join" },
        { name: "The complement", explanation: "The complement G̅ keeps the original vertex set and exchanges adjacency with nonadjacency between distinct vertices. Each possible pair is an edge in exactly one of G and G̅. Complementing twice returns the original graph; some graphs are isomorphic to their own complement.", formula: "E(G̅) = [V(G)]² ∖ E(G)", visual: "complement" },
        { name: "The line graph", explanation: "The line graph L(G) turns each edge of G into a vertex. Two of these new vertices are adjacent precisely when their original edges share an end. For example, the three edges of a three-leaf star become the three pairwise adjacent vertices of a triangle.", formula: "V(L(G))=E(G);  ef ∈ E(L(G)) ⇔ e,f share an end", visual: "linegraph" },
        { name: "Set notation and mathematical conventions", explanation: "[A]ᵏ means all k-element subsets of A. A partition splits a set into disjoint nonempty classes covering the set; a refinement splits classes further. The chapter uses ℕ including 0, floor ⌊x⌋ and ceiling ⌈x⌉, base-2 log, natural log ln, and := for a definition. ℤₙ means integers modulo n; 𝔽₂ is the field {0,1} with arithmetic modulo 2.", visual: "sets" }
      ],
      theorems: [
        { name: "A drawing is not the graph", statement: "Moving vertices or bending edges preserves the graph as long as the same pairs remain adjacent.", insight: "Separate a representation from its structure. This is why two visually different pictures can be the same abstract graph." },
        { name: "Three containment questions", statement: "A subgraph selects vertices and edges. An induced subgraph is forced by its vertices. A spanning subgraph retains every vertex.", insight: "For a triangle, removing one edge gives a spanning path, but that path is not induced on the three vertices." }
      ],
      challenge: { question: "Starting with a triangle, keep all three vertices and delete one edge. The result is…", options: ["a spanning subgraph, but not an induced subgraph", "an induced subgraph, but not spanning", "both induced and spanning"], answer: 0, explanation: "It keeps all vertices, so it is spanning. An induced graph on those three vertices must retain all three original edges." }
    },
    {
      id: "degrees", number: "1.2", title: "The degree of a vertex", kicker: "Local counts, global consequences",
      description: "Degree measures a vertex’s immediate connections. Counting those connections in two different ways links local behaviour to the whole graph, and reveals a dense core inside any graph with edges.",
      concepts: [
        { name: "Neighbourhoods of vertices and sets", explanation: "N(v) is the set of vertices adjacent to v. For a set U, N(U) contains vertices outside U adjacent to at least one vertex in U. The outside condition matters: neighbours lying inside U are excluded from N(U). A subscript, such as N_G(v), specifies the graph.", visual: "degree" },
        { name: "Degree and isolated vertices", explanation: "The degree, or valency, d(v) counts incident edges. In a simple graph it also counts neighbours. A vertex of degree zero is isolated. Degree depends on the ambient graph: the same vertex can have a smaller degree in a subgraph.", formula: "d_G(v) = |E_G(v)| = |N_G(v)|", visual: "degree" },
        { name: "Minimum, maximum, and average degree", explanation: "δ(G) is the least vertex degree, Δ(G) the greatest, and d(G) their arithmetic mean. The average can be high while some vertices have low degree. Minimum degree expresses a guarantee at every vertex, which is stronger than an average guarantee.", formula: "δ(G) ≤ d(G) = (1/n)Σᵥ d(v) ≤ Δ(G)", visual: "degree" },
        { name: "Regular and cubic graphs", explanation: "A k-regular graph has degree k at every vertex; ‘regular’ means this holds for some k. A cubic graph is 3-regular. Complete graphs Kⁿ are (n−1)-regular, and cycles are 2-regular. Regularity concerns connections, not visual symmetry.", visual: "regular" },
        { name: "Edge density ε and normalized density", explanation: "Diestel’s ε(G) is edges per vertex, m/n. It equals half the average degree and can grow with graph order. Another common convention divides m by the maximum possible number of edges; that normalized density lies between 0 and 1. Keep the conventions separate.", formula: "ε(G) = m/n = d(G)/2;  normalized density = 2m/[n(n−1)]", visual: "density" },
        { name: "Double-counting degrees", explanation: "When summing all degrees, each edge appears once at each end. Thus the sum is twice the number of edges. This is the handshaking identity: counting the same incidences by vertices and by edges gives the same total.", formula: "Σᵥ d(v) = 2m", visual: "degree" },
        { name: "Odd-degree parity", explanation: "An even sum of integers contains an even number of odd summands. Since the degree sum is even, odd-degree vertices always come in an even number. There may be zero, two, four, or more; there can never be exactly one.", formula: "|{v : d(v) is odd}| ≡ 0 (mod 2)", visual: "parity" },
        { name: "Pruning to a dense core", explanation: "Delete a vertex whose degree is at most the current edges-per-vertex ratio. Removing no more than ε edges while removing one vertex cannot lower that ratio. Repeating eventually leaves a nonempty subgraph whose every vertex has degree greater than its own ε, while ε has never fallen.", formula: "δ(H) > ε(H) ≥ ε(G)", visual: "prune" }
      ],
      theorems: [
        { name: "Proposition 1.2.1 · odd degrees", statement: "Every finite graph has an even number of vertices of odd degree.", insight: "Sum the degrees. Every edge contributes 2, so the sum is even, and the number of odd terms must be even." },
        { name: "Proposition 1.2.2 · a dense subgraph", statement: "Every graph G with at least one edge has a subgraph H with δ(H)>ε(H)≥ε(G). Equivalently, δ(H)>d(H)/2 and d(H)≥d(G).", insight: "Repeatedly remove vertices of degree at most the current ε. Density cannot decrease, and the process cannot finish with a lone vertex because that graph has density zero." }
      ],
      challenge: { question: "A graph has 7 edges. What must the sum of its vertex degrees be?", options: ["7", "14", "It depends on the number of vertices"], answer: 1, explanation: "Each of the 7 edges contributes 1 to each of its two ends, so the degree sum is 14." }
    },
    {
      id: "paths", number: "1.3", title: "Paths and cycles", kicker: "Routes, loops, and distance",
      description: "Paths trace a route without revisiting a vertex; cycles close the route. Shortest routes define distance, while branching arguments explain why large degree and long cycles require space.",
      concepts: [
        { name: "Paths, length, ends, and inner vertices", explanation: "A path is a sequence of distinct vertices with edges joining successive vertices. Its first and last vertices are its ends; the others are inner vertices. Length counts edges. In Diestel’s notation Pᵏ has k edges and k+1 vertices; P⁰ is one vertex.", formula: "Pᵏ = x₀x₁…xₖ,  with all xᵢ distinct", visual: "path" },
        { name: "Subpaths and concatenation", explanation: "xPy denotes the section of path P from x to y; Px and xP mean its beginning and end sections when an ordering is fixed. P with a ring denotes its interior, omitting both ends; a ring over a specified endpoint means omit that endpoint. Writing xPyQz concatenates sections, provided the combined route remains a path without repeated vertices.", visual: "path" },
        { name: "A–B paths, A-paths, and H-paths", explanation: "An A–B path meets A only at its first end and B only at its last. A nontrivial A-path has both ends, but no inner vertex, in A. An H-path uses V(H) as this set; if it is a single edge, that edge must lie outside H. These notions describe excursions between parts of a graph.", visual: "path" },
        { name: "Independent paths", explanation: "Paths are independent when none contains an inner vertex of another. For two paths with the same distinct ends a,b, this means their only shared vertices are a and b. Independent paths describe routes that can coexist without sharing an internal bottleneck.", visual: "independentpaths" },
        { name: "Cycles and cycle length", explanation: "A cycle closes a path of at least three vertices by joining its ends. Each vertex has degree 2 within that cycle. Cᵏ denotes a cycle with k vertices and k edges. A vertex can have higher degree in the surrounding graph because extra edges may leave the cycle.", formula: "Cᵏ = x₀x₁…xₖ₋₁x₀,  k ≥ 3", visual: "cycle" },
        { name: "Girth and circumference", explanation: "The girth g(G) is the length of a shortest cycle; the circumference is the length of a longest cycle. If there is no cycle, girth is ∞ and circumference is 0. A graph may simultaneously have high minimum degree and large girth if its order is allowed to grow.", visual: "cycle" },
        { name: "Chords, induced cycles, and geodesic cycles", explanation: "A chord joins two cycle vertices but is not a cycle edge. An induced cycle has no chords. A geodesic cycle, introduced in the exercises, also has no shorter route through the surrounding graph: distances between its vertices agree with their distances along the cycle. Geodesic is stronger than induced.", visual: "chord" },
        { name: "Walks and closed walks", explanation: "A walk alternates vertices and incident edges, with each edge joining the vertices immediately before and after it. Vertices and edges may repeat. A closed walk starts and ends at the same vertex. Deleting detours from any walk between two vertices leaves a path between them.", formula: "v₀e₀v₁e₁…eₖ₋₁vₖ,  eᵢ = {vᵢ,vᵢ₊₁}", visual: "walk" },
        { name: "Distance and shortest paths", explanation: "The distance d_G(x,y) is the fewest edges in an x–y path. It is 0 when x=y and ∞ when the vertices are in different components. The symbol d here measures distance between two vertices; d(v) with one vertex measures degree.", formula: "d_G(x,y) = minimum length of an x–y path", visual: "distance" },
        { name: "Diameter, radius, and central vertices", explanation: "A vertex’s greatest distance to any vertex is its eccentricity. Diameter is the greatest eccentricity; radius is the least. Central vertices attain the radius. These measure worst-case travel across the whole graph and from the best starting point, respectively.", formula: "rad(G) = minₓ maxᵧ d(x,y);  diam(G) = maxₓ,ᵧ d(x,y)", visual: "distance" },
        { name: "Distance layers and bounded branching", explanation: "Around a chosen root, layer Dᵢ contains vertices at distance i. A shortest path reaches each layer from the preceding one. With maximum degree d, the first layer has at most d vertices, and subsequent layers can expand by at most d−1 per previous vertex: one neighbour is already behind it.", formula: "|D₀|=1, |D₁|≤d, |Dᵢ₊₁|≤(d−1)|Dᵢ|", visual: "layers" },
        { name: "The Moore bound n₀(d,g)", explanation: "High degree forces rapid branching, while large girth prevents nearby branches from colliding. For odd girth, grow from a vertex; for even girth, grow from both ends of an edge. The Moore bound counts the distinct vertices those branches require. Remarkably, average degree suffices for the same lower bound.", formula: "n₀(d,2r+1)=1+dΣᵢ₌₀ʳ⁻¹(d−1)ⁱ;  n₀(d,2r)=2Σᵢ₌₀ʳ⁻¹(d−1)ⁱ", visual: "layers" },
        { name: "The hypercube (exercise extension)", explanation: "The d-dimensional cube has all binary strings of length d as vertices, with edges between strings differing in one position. It is d-regular, has 2ᵈ vertices and d·2ᵈ⁻¹ edges for d≥1, and diameter d. For d≥2 its girth is 4, and it has a cycle visiting all 2ᵈ vertices.", formula: "V(Q_d)={0,1}ᵈ;  distance = number of differing positions", visual: "cube" }
      ],
      theorems: [
        { name: "Proposition 1.3.1 · degree forces long routes", statement: "Every nonempty finite graph contains a path of length δ(G). If δ(G)≥2, it contains a cycle of length at least δ(G)+1.", insight: "An end of a longest path has no neighbour outside that path. Its δ neighbours force a long path; closing back to the earliest neighbour gives the long cycle." },
        { name: "Proposition 1.3.2 · girth and diameter", statement: "If G contains a cycle, then g(G)≤2 diam(G)+1.", insight: "If a shortest cycle were longer, distant vertices on it would have a shortcut in G. That shortcut and a section of the cycle would make a shorter cycle." },
        { name: "Radius–diameter inequality", statement: "rad(G)≤diam(G)≤2 rad(G).", insight: "The first comparison follows from minimum versus maximum. For the second, travel from x to a central vertex and then to y; the two legs each cost at most the radius." },
        { name: "Proposition 1.3.3 · bounded degree and radius", statement: "If rad(G)≤k and Δ(G)≤d with d≥3, then |G|≤1+dΣᵢ₌₀ᵏ⁻¹(d−1)ⁱ < [d/(d−2)](d−1)ᵏ.", insight: "Count the distance layers from a central vertex. Bounded branching limits how many vertices can lie within k steps." },
        { name: "Theorem 1.3.4 · Alon–Hoory–Linial", statement: "If d(G)≥d≥2 and g(G)≥g, where g is a natural number, then |G|≥n₀(d,g).", insight: "Large girth makes short nonreturning routes spread like a tree. The theorem extends the elementary minimum-degree count to average degree through a more subtle counting argument." },
        { name: "Corollary 1.3.5 · a short cycle", statement: "If δ(G)≥3, then g(G)<2 log₂|G|.", insight: "A cycle-free neighbourhood would branch at least twofold. The graph runs out of vertices before it can sustain that branching for too many layers." }
      ],
      challenge: { question: "How many vertices does Diestel’s path P⁵ contain?", options: ["4", "5", "6"], answer: 2, explanation: "The superscript counts edges. A path with 5 edges has 6 distinct vertices." }
    },
    {
      id: "connectivity", number: "1.4", title: "Connectivity", kicker: "How difficult is it to pull apart?",
      description: "Connectivity starts with reachability and develops into resistance to failure. Components, separators, bridges, and vertex or edge connectivity describe the graph’s weak points.",
      concepts: [
        { name: "Connected and disconnected graphs", explanation: "A graph is connected when it is nonempty and every pair of vertices is linked by a path. A vertex set U is connected when its induced graph G[U] is connected. Otherwise the graph is disconnected. A single vertex is connected; the empty graph is not.", visual: "connected" },
        { name: "Components and connected vertex orderings", explanation: "A component is a maximal connected subgraph. Components are induced, and their vertex sets partition V(G). A connected finite graph can be built one vertex at a time while remaining connected: repeatedly add a vertex adjacent to those already chosen.", visual: "components" },
        { name: "Separating sets and separators", explanation: "A set of vertices, edges, or a mixture of both separates A from B when every A–B path meets it. To say it separates two particular vertices, neither endpoint is in the separating set. A separator separates some two vertices of the graph. Separators identify unavoidable passage points or barriers.", visual: "separator" },
        { name: "Cutvertices and bridges", explanation: "A cutvertex separates two other vertices in its own component. A bridge is an edge whose removal disconnects its ends. An edge is a bridge exactly when it lies on no cycle: a cycle supplies an alternative route, while an alternative route together with the edge would form a cycle.", visual: "bridge" },
        { name: "Separations, sides, and order", explanation: "A separation {A,B} has A∪B=V and no edge between A∖B and B∖A. The overlapping set A∩B separates the two sides; its size is the separation’s order. A separation is proper when both exclusive sides are nonempty. Separations describe the whole graph split around a separator.", formula: "order({A,B}) = |A∩B|", visual: "separation" },
        { name: "k-connectivity and vertex connectivity κ", explanation: "G is k-connected if it has more than k vertices and deleting any set of fewer than k vertices leaves it connected. Its vertex connectivity κ(G) is the largest such k. A nontrivial graph is 1-connected exactly when connected; κ(Kⁿ)=n−1. A disconnected graph or a single vertex has κ=0.", formula: "|G|>k and G−X connected for every |X|<k", visual: "connectivity" },
        { name: "Edge connectivity λ", explanation: "A graph of order at least two is ℓ-edge-connected when deleting fewer than ℓ edges always leaves it connected. λ(G) is the largest such ℓ; it is 0 for disconnected graphs. Edge failures and vertex failures differ: removing one vertex may remove many incident edges at once.", visual: "edgeconnectivity" },
        { name: "Connectivity versus minimum degree", explanation: "To isolate a minimum-degree vertex, delete all its incident edges, showing λ≤δ. Vertex connectivity is never greater than edge connectivity. The reverse implication from high minimum degree fails: two large complete graphs can share a single cutvertex despite every vertex having many neighbours.", formula: "κ(G) ≤ λ(G) ≤ δ(G)", visual: "connectivity" },
        { name: "Dense graphs contain robust subgraphs", explanation: "High average degree need not make the whole graph well connected, but it forces a highly connected region somewhere inside. Mader’s theorem turns density into the existence of a robust subgraph, linking this section to the pruning argument in 1.2.", visual: "prune" }
      ],
      theorems: [
        { name: "Proposition 1.4.1 · grow a connected graph", statement: "A connected finite graph has an ordering v₁,…,vₙ such that G[{v₁,…,vᵢ}] is connected for every i.", insight: "Until every vertex has been chosen, connectivity guarantees an edge leaving the chosen set. Add its other end." },
        { name: "Proposition 1.4.2 · the connectivity inequalities", statement: "For every nontrivial simple graph, κ(G)≤λ(G)≤δ(G).", insight: "The edges at a minimum-degree vertex form a separating edge set. A minimal edge separator can also be used to find a vertex separator no larger than itself, with complete graphs handled directly." },
        { name: "Theorem 1.4.3 · Mader", statement: "For every integer k≥1, if d(G)≥4k, G has a k-connected subgraph. In fact it has a (k+1)-connected subgraph H with d(H)>d(G)−2k≥2k.", insight: "Choose a smallest subgraph satisfying a strong edge-count inequality. Low-degree vertices could be deleted, and a small separation would split it into two smaller candidates; both contradict minimality." }
      ],
      challenge: { question: "An edge lies on a cycle. Can it be a bridge?", options: ["Yes, if its ends have high degree", "No, the rest of the cycle gives another route", "Only when the cycle has odd length"], answer: 1, explanation: "Deleting that edge still leaves a path between its ends around the remainder of the cycle." }
    },
    {
      id: "trees", number: "1.5", title: "Trees and forests", kicker: "Connectivity with no redundancy",
      description: "Trees connect vertices with exactly the structure needed for unique routes. Rooting a tree adds an order, and normal spanning trees let that order expose separators in a much richer graph.",
      concepts: [
        { name: "Forests, trees, leaves, and inner vertices", explanation: "A forest has no cycles; a tree is a connected forest. Each component of a forest is a tree. A leaf has degree 1, and other tree vertices are inner vertices. Every nontrivial finite tree has at least two leaves, visible at the ends of a longest path. In a rooted tree Diestel does not call the root a leaf.", visual: "tree" },
        { name: "Unique tree paths", explanation: "There is exactly one path between any two vertices of a tree. Diestel writes xTy for that path. If two different routes existed, they would diverge and meet again, making a cycle. This uniqueness makes tree arguments especially clean.", visual: "treepath" },
        { name: "Minimal connectivity and maximal acyclicity", explanation: "Every tree edge is essential for connectivity: deleting it splits the tree. Conversely, adding any edge between nonadjacent tree vertices creates a cycle. Thus a tree is both minimally connected and maximally acyclic, with maximal acyclicity understood among graphs on the same vertex set.", visual: "tree" },
        { name: "Spanning trees, spanning forests, and chords", explanation: "A spanning tree of a connected graph retains every vertex and just enough edges to remain connected without cycles. Taking one tree per component gives a spanning forest. Edges outside a spanning tree are its chords; each chord creates one unique cycle when added back.", visual: "spanningtree" },
        { name: "Tree and forest edge counts", explanation: "A finite tree on n vertices has n−1 edges. A forest on n vertices with c components has n−c edges. For a connected graph, having exactly n−1 edges characterizes trees; the same edge count alone does not characterize a tree if connectedness is missing.", formula: "m(T)=n−1;  m(F)=n−c", visual: "tree" },
        { name: "Embedding any small tree", explanation: "If a graph’s minimum degree is at least t−1, it contains every tree with t vertices as a subgraph. Build the tree from a root outward. When adding a new vertex, its already placed parent still has an unused neighbour because fewer than t−1 other vertices are occupied.", visual: "tree" },
        { name: "Rooted trees and the tree-order", explanation: "Choose a root r. Define x≤y when x lies on the path rTy, so x is an ancestor of y. Diestel views the root as the least element, below its descendants. Comparable vertices lie on one root-to-vertex chain; vertices in different branches can be incomparable.", formula: "x ≤ y ⇔ x ∈ V(rTy)", visual: "rootedtree" },
        { name: "Down-closures, up-closures, and chains", explanation: "The down-closure ↓y contains y and its ancestors; the up-closure ↑x contains x and its descendants. Diestel denotes these by special ceiling- and floor-shaped brackets. A chain is a set of pairwise comparable vertices; ↓y is always a chain. A down-set contains every ancestor of each member; an up-set contains every descendant.", visual: "ancestors" },
        { name: "Height and levels", explanation: "A vertex’s height is its distance from the root. All vertices of height k form the kth level. Distinct vertices on one level are incomparable. This is distance within the tree, and may exceed their distance in the surrounding graph.", visual: "levels" },
        { name: "Normal trees", explanation: "A rooted tree T inside G is normal if the ends of every T-path in G are comparable in T’s order. For a spanning tree, this simplifies to every graph edge joining an ancestor and a descendant. Edges may skip levels, but cannot join separate branches.", visual: "normaltree" },
        { name: "Normal trees as separators", explanation: "For incomparable x,y in a normal tree, their shared ancestors ↓x∩↓y separate them even in the surrounding graph. For a normal spanning tree, removing a down-set leaves exactly the descendant subtrees rooted at the first remaining vertices. Extra graph edges do not reconnect those branches.", visual: "separator" },
        { name: "Depth-first search trees", explanation: "Start at a root, follow an edge to an unvisited vertex whenever possible, and backtrack when stuck. The first-visit edges form a spanning tree in a connected finite graph. Depth-first search finishes each branch before starting another, ensuring that every extra edge joins comparable vertices: the tree is normal.", visual: "dfs" },
        { name: "Tree exercises: leaves, intersections, and exchange", explanation: "Finite tree structure supports several useful extensions: a nontrivial unrooted tree has at least Δ(T) leaves; pairwise intersecting subtrees of a finite tree share a common vertex; and if two finite forests on the same vertices have different sizes, an edge from the larger can augment the smaller without forming a cycle. Every finite tree automorphism fixes a vertex or an edge setwise.", visual: "tree" }
      ],
      theorems: [
        { name: "Theorem 1.5.1 · four views of a tree", statement: "For a nonempty graph, being a tree, having a unique path between each vertex pair, being minimally connected, and being maximally acyclic are equivalent.", insight: "Two routes produce a cycle; cycles make edges dispensable. Conversely, an edge added to a tree closes its unique existing route." },
        { name: "Corollary 1.5.2 · n−1 edges", statement: "A connected graph with n vertices is a tree exactly when it has n−1 edges.", insight: "Grow a tree one vertex and one edge at a time. Conversely, a connected graph has a spanning tree already using n−1 edges, leaving no room for extra edges." },
        { name: "Corollary 1.5.3 · a tree fits in a high-degree graph", statement: "If T is a finite tree and δ(G)≥|T|−1, then G contains a subgraph isomorphic to T.", insight: "Add the tree’s vertices in a connected order. Each new vertex attaches to one parent, and the parent’s degree guarantees an unused neighbour." },
        { name: "Lemma 1.5.4 · normal-tree separation", statement: "In a normal tree, the common ancestors of incomparable x,y separate them in G. For a normal spanning tree, deleting a down-closed set leaves components induced by the up-closures of minimal remaining vertices.", insight: "Any route between branches must descend to a common ancestor. The normality condition rules out shortcuts between incomparable vertices." },
        { name: "Proposition 1.5.5 · normal spanning trees exist", statement: "Every connected finite graph has a normal spanning tree; any vertex can be chosen as its root.", insight: "A maximal normal tree cannot miss a component: its neighbours in the tree form a chain, and a new vertex can be attached above the highest neighbour. Depth-first search gives another construction." }
      ],
      challenge: { question: "A connected graph has 8 vertices and 7 edges. What follows?", options: ["It is a tree", "It must contain a cycle", "There is too little information"], answer: 0, explanation: "Connectedness plus m=n−1 characterizes a tree. Connectedness is essential in this statement." }
    },
    {
      id: "bipartite", number: "1.6", title: "Bipartite graphs", kicker: "Two sides, one parity test",
      description: "A bipartite graph separates its vertices into two independent groups. The possibility of this separation is controlled exactly by the parity of cycles.",
      concepts: [
        { name: "r-partite graphs and partition classes", explanation: "An r-partite graph splits its vertices into r classes, with every edge going between different classes. Each class is independent. r-partite describes the existence of such a partition, not a particular drawing. Diestel takes partition classes to be nonempty; permitting empty classes extends the definition to graphs with fewer than r vertices.", visual: "multipartite" },
        { name: "Bipartite graphs and bipartitions", explanation: "Bipartite means 2-partite: there are two independent sides A and B and every edge crosses between them. The sides need not have the same size. A connected bipartite graph with an edge has a unique bipartition up to swapping sides; disconnected components can be swapped independently.", visual: "bipartite" },
        { name: "Complete multipartite graphs", explanation: "A complete r-partite graph has every possible edge between different classes and no edge within a class. Kₙ₁,…,ₙᵣ records the class sizes. When all r classes have size s, Diestel abbreviates this to Kₛʳ. It can be formed by joining independent graphs of those sizes.", formula: "m = Σᵢ<ⱼ nᵢnⱼ", visual: "multipartite" },
        { name: "Complete bipartite graphs", explanation: "Kₘ,ₙ has m vertices on one side and n on the other, with every cross edge present. Each vertex on the first side has degree n, and each on the second has degree m. It has m+n vertices and mn edges. K₃,₃ looks different in many drawings but stays bipartite.", formula: "|V(Kₘ,ₙ)|=m+n;  |E(Kₘ,ₙ)|=mn", visual: "completebipartite" },
        { name: "Stars and their centres", explanation: "A star K₁,ₙ has one centre connected to n outer vertices, with no edges among those outer vertices. It is both a tree and a complete bipartite graph. For n≥2 its centre has degree n and its leaves have degree 1.", visual: "star" },
        { name: "Odd cycles as obstructions", explanation: "Along any cycle in a bipartite graph the two sides alternate, so returning to the starting side takes an even number of edges. An odd cycle makes a bipartition impossible. Conversely, if there is no odd cycle, assign sides by the parity of distance from a root in each component.", visual: "oddcycle" },
        { name: "A spanning-tree parity construction", explanation: "Root a spanning tree and put vertices in sides according to even or odd tree depth. Tree edges cross sides. A remaining edge within one side would close an odd cycle with the unique tree route between its ends. Without odd cycles, every remaining edge must also cross sides.", visual: "bipartite" },
        { name: "Balance in regular bipartite graphs", explanation: "In a k-regular bipartite graph with k>0, both sides have equal size: count edges from each side to get k|A|=m=k|B|. This balance need not hold when k=0, because isolated vertices can be placed freely. Equal side sizes alone do not imply regularity.", formula: "Σₐ∈A d(a) = m = Σᵦ∈B d(b)", visual: "bipartite" }
      ],
      theorems: [
        { name: "Proposition 1.6.1 · the odd-cycle test", statement: "A graph is bipartite if and only if it contains no odd cycle.", insight: "One direction alternates sides around a cycle. For the other, parity in a rooted spanning tree gives a partition, and any same-side edge would make an odd cycle." },
        { name: "Exercise extension · induced cycles suffice", statement: "A graph is bipartite if and only if every induced cycle has even length.", insight: "A shortest odd cycle has no chord: a chord would split it into two shorter cycles, one of which is odd. Thus an odd-cycle obstruction always has an induced example." }
      ],
      challenge: { question: "Which graph cannot be bipartite?", options: ["A tree with 9 vertices", "A cycle of length 6", "A cycle of length 5"], answer: 2, explanation: "The 5-cycle is odd. Trees have no cycles, and the 6-cycle alternates between two sides." }
    },
    {
      id: "minors", number: "1.7", title: "Contraction and minors", kicker: "Connections survive simplification",
      description: "Deleting elements finds subgraphs. Stretching edges finds topological minors. Contracting connected regions finds minors. Each relation asks how a smaller connection pattern can live inside a larger graph.",
      concepts: [
        { name: "Subdivisions and TX", explanation: "A subdivision replaces each chosen edge by a path between the original ends. The new paths have disjoint interiors and none of those interiors contains an original vertex. Diestel calls a subdivision of X a TX, with T standing for topological. Replacing no edges is allowed.", visual: "subdivision" },
        { name: "Branch vertices and subdividing vertices", explanation: "The original vertices of X become the subdivision’s branch vertices, retaining their original degrees. Inserted vertices are subdividing vertices of degree 2. A branch vertex can also have degree 2 if it already did in X, so degree alone does not always identify its role.", visual: "subdivision" },
        { name: "Topological minors", explanation: "X is a topological minor of Y when Y contains a subdivision of X as a subgraph. Vertices of X are represented by distinct vertices, and its edges by routes with mutually disjoint interiors that avoid those vertex images. Extra vertices and edges of Y can be ignored.", visual: "topologicalminor" },
        { name: "Inflated graphs IX and branch sets", explanation: "An IX replaces each vertex x of X by a nonempty connected vertex set Vₓ. These branch sets are disjoint and partition the inflated graph’s vertices. Two branch sets are joined exactly when their original vertices are adjacent in X. Internal structure may be elaborate, but each set behaves as one vertex when contracted.", visual: "branchsets" },
        { name: "Minors and models", explanation: "X is a minor of Y, written X≼Y, if a subgraph of Y is an IX. That subgraph is a model of X in Y. Equivalently, find disjoint connected branch sets in Y with an edge between each pair required by X; delete unwanted edges and vertices. Extra cross edges in Y are permitted because the model is only a subgraph.", formula: "X ≼ Y ⇔ Y contains a model of X", visual: "minor" },
        { name: "Contraction maps and contraction minors", explanation: "A contraction sends all vertices of a connected branch set to one new vertex. A contraction minor uses all original vertices, partitioned into connected sets, and retains the adjacency pattern between classes. A minor more generally allows deleting some of the original graph first.", visual: "contraction" },
        { name: "Contracting a set, a partition, or an edge", explanation: "G/𝒫 contracts every class in a connected partition 𝒫; G/U contracts just one connected set U. Contracting an edge e=xy merges its two ends into vₑ. For simple graphs, loops are discarded and multiple copies of the same resulting edge are merged; the multigraph convention in 1.10 instead retains them.", formula: "G/e: merge x,y and preserve adjacency to their other neighbours", visual: "contraction" },
        { name: "Deletion–contraction recipes", explanation: "For finite graphs, a minor is exactly what can be obtained through vertex deletions, edge deletions, and edge contractions. A branch-set model provides such a recipe: keep a spanning tree inside each branch set, contract it, and remove surplus structure. Each individual operation also creates a minor.", visual: "minor" },
        { name: "Partial orders and containment hierarchy", explanation: "On finite graphs considered up to isomorphism, both minor and topological-minor relations are reflexive, transitive, and antisymmetric. An induced subgraph is a subgraph; a subgraph is a topological minor; a topological minor is a minor. The reverse implications generally fail.", formula: "induced subgraph ⇒ subgraph ⇒ topological minor ⇒ minor", visual: "hierarchy" },
        { name: "When a minor is also topological", explanation: "Every topological minor is a minor: contract suitable sections of its subdivided paths. Conversely, if the target X has maximum degree at most 3, every minor model contains a subdivision of X. For larger target degrees a branch set can combine connections that no single branch vertex can realize.", formula: "Δ(X)≤3 and X≼Y ⇒ X is a topological minor of Y", visual: "branchsets" },
        { name: "Embeddings depend on the structure preserved", explanation: "A subgraph embedding is an injective vertex map preserving adjacency. An induced embedding preserves nonadjacency too. A topological embedding maps edges to internally disjoint paths. A minor embedding maps vertices to disjoint connected sets. An induced-minor embedding also requires no cross edge for a nonadjacent target pair. Always specify the structure preserved.", visual: "embedding" }
      ],
      theorems: [
        { name: "Proposition 1.7.1 · partial orders", statement: "The minor and topological-minor relations are partial orders on finite graph isomorphism types.", insight: "A graph contains itself; successive models can be composed. If two finite graphs each contain the other in one of these ways, vertex and edge counts prevent a strict simplification, so they are isomorphic." },
        { name: "Corollary 1.7.2 · the three operations", statement: "For finite graphs X,Y, X≼Y exactly when X is obtained from Y through edge deletions, edge contractions, and vertex deletions.", insight: "Contract a spanning tree within each branch set of a model. Conversely, each operation gives a minor, and the minor relation is transitive." },
        { name: "Proposition 1.7.3 · topological versus ordinary minors", statement: "Every TX is also an IX. If Δ(X)≤3, every IX contains a TX.", insight: "At most three attachments can be joined inside a connected branch set by a small tree with one central branch point. Four or more attachments can need several branch points instead." }

    },
    {
      id: "euler", number: "1.8", title: "Euler tours", kicker: "Use every edge, exactly once",
      description: "The bridge-walking problem becomes a theorem about parity. Euler tours test whether all connections can be traversed once and return to the start, and their construction explains why even degrees are the key.",
      concepts: [
        { name: "The Königsberg bridge model", explanation: "Represent each land region by a vertex and each bridge by an edge. The historical problem asks for a route crossing each bridge once. Multiple bridges between the same regions make a multigraph the natural model. Its four vertices have degrees 3,3,3,5, so the parity test rules out a closed tour.", visual: "bridges" },
        { name: "Euler tours and Eulerian graphs", explanation: "An Euler tour is a closed walk traversing every edge of the graph exactly once. A graph admitting one is Eulerian. Vertices may be revisited; edges may not. A connected graph with no edges consists of one vertex and has a length-zero Euler tour.", visual: "euler" },
        { name: "Trails and open Euler routes", explanation: "A trail is a walk with no repeated edge; this useful standard term supplements the chapter. An open Euler trail uses every edge once but ends somewhere different from its start. In a connected graph it exists exactly when there are two odd-degree vertices, and those vertices must be its ends.", visual: "trail" },
        { name: "Why degrees must be even", explanation: "On a closed edge-by-edge tour, every arrival at a vertex pairs with a departure along a different edge. The start also pairs its first departure with its final arrival. These pairs use all incident edges, so every degree is even. Open routes leave one unpaired use at each of their ends.", visual: "parity" },
        { name: "Splicing closed trails", explanation: "Follow unused edges until returning to the start. If unused edges remain, connectivity guarantees that a vertex already on the route reaches an unused component. Build another closed trail there and splice it into the first. Repeating produces an Euler tour; this constructive method is commonly called Hierholzer’s algorithm.", visual: "splice" },
        { name: "Connectivity and isolated vertices", explanation: "Even degrees alone are insufficient: two disjoint cycles cannot share a single tour. For a graph with edges, the exact general condition is that all vertices of positive degree lie in one component and all degrees are even. Isolated vertices can be ignored by the edge-traversing tour; Diestel states the theorem for connected graphs.", visual: "components" },
        { name: "Edge tours versus vertex tours", explanation: "Euler tours concern every edge. A Hamilton cycle, studied later in the book, concerns every vertex exactly once. A graph can have one property without the other. Distinguishing the objects being visited prevents a common confusion.", visual: "euler" }
      ],
      theorems: [
        { name: "Theorem 1.8.1 · Euler", statement: "A connected finite graph is Eulerian if and only if every vertex has even degree.", insight: "Necessity pairs arrivals with departures. For sufficiency, even degree prevents a trail from getting stuck away from its start, and additional closed trails can be spliced in until every edge is used." },
        { name: "Companion extension · an open route", statement: "A connected finite graph has an Euler trail with different ends exactly when it has two odd-degree vertices.", insight: "Temporarily add an edge between the two odd vertices, allowing a parallel edge if needed. Take an Euler tour in that multigraph, then remove the added edge to open the tour." }
      ],

    {
      id: "algebra", number: "1.9", title: "Some linear algebra", kicker: "Edge sets become vectors",
      description: "Over the field 𝔽₂, choosing an edge means writing 1 and leaving it out means writing 0. Addition toggles membership. Cycles and cuts become complementary algebraic structures whose bases are supplied by a spanning tree.",
      concepts: [
        { name: "Vertex space and edge space", explanation: "The vertex space is all functions V→𝔽₂, and the edge space is all functions E→𝔽₂. Indicator functions identify these vectors with subsets of vertices or edges. Singletons form the standard bases, so the dimensions are n and m. The zero vector is the empty set.", formula: "dim 𝒱(G)=n;  dim ℰ(G)=m", visual: "vectors" },
        { name: "Symmetric difference and 𝔽₂ arithmetic", explanation: "In 𝔽₂, 1+1=0. Adding two sets keeps items appearing in exactly one: their symmetric difference. A shared edge cancels; an unshared edge survives. Every vector is its own additive inverse, and adding any set to itself yields the empty set.", formula: "F+F′ = (F∖F′) ∪ (F′∖F);  F+F=∅", visual: "xor" },
        { name: "Inner products and orthogonal complements", explanation: "The edge-space inner product is the parity of the number of shared edges. Orthogonal means an even intersection. For a subspace 𝒲, its orthogonal complement 𝒲⊥ contains edge sets orthogonal to every member of 𝒲. This is algebraic parity, not geometric right angles; a nonzero vector can even be orthogonal to itself.", formula: "⟨F,F′⟩=|F∩F′| mod 2;  dim 𝒲+dim 𝒲⊥=m", visual: "parity" },
        { name: "The cycle space and cyclomatic number", explanation: "The cycle space 𝒞(G) is generated by cycle edge sets under symmetric difference. Its elements are exactly edge sets giving every vertex even degree. Such a set decomposes into edge-disjoint cycles, possibly sharing vertices. The empty set belongs too. A cycle’s edge set is also called a circuit. The space’s dimension is the cyclomatic number.", visual: "cyclespace" },
        { name: "Cuts, sides, and crossing edges", explanation: "Choose two nonempty sides partitioning V. A cut contains exactly all edges crossing between the sides, not an arbitrary collection of edges that happens to disconnect the graph. In a connected graph the cut determines its unordered pair of sides uniquely. Under Diestel’s nonempty-side convention, ∅ is a cut only in disconnected graphs.", formula: "δ(U)=E(U,V∖U),  ∅≠U≠V", visual: "cut" },
        { name: "Bonds and atomic cuts", explanation: "A bond is a minimal nonempty cut by edge-set inclusion. In a connected graph it is a bond exactly when both sides induce connected subgraphs. Atomic cuts are the incident edge sets E(v), which isolate one vertex; an atomic cut need not be a bond. Every cut decomposes into edge-disjoint bonds.", visual: "bond" },
        { name: "The cut or bond space", explanation: "All cuts, together with ∅, form the cut space 𝓑(G). Atomic cuts generate it: summing E(v) over vertices v in U cancels internal edges twice and retains each crossing edge once. Bonds are its minimal nonzero elements, just as cycle edge sets are the minimal nonzero elements of the cycle space.", formula: "δ(U) = Σᵥ∈U E(v) over 𝔽₂", visual: "cutspace" },
        { name: "Cycle–cut orthogonality", explanation: "A closed route enters a cut’s side as often as it leaves, so any cycle crosses every cut an even number of times. More strongly, the cycle space is exactly the orthogonal complement of the cut space, and conversely. Orthogonal complements here need not be a direct-sum decomposition: an edge set can lie in both spaces.", formula: "𝒞(G)=𝓑(G)⊥;  𝓑(G)=𝒞(G)⊥", visual: "orthogonal" },
        { name: "Fundamental cycles", explanation: "Fix a spanning tree T. Each chord e=xy outside T creates a unique cycle Cₑ consisting of e and the tree path xTy. These fundamental cycles form a basis of the cycle space. Each has its own unique chord, making independence clear; arbitrary cycles are sums of the fundamental cycles for their chords.", visual: "fundamentalcycle" },
        { name: "Fundamental cuts and dual membership", explanation: "Deleting a tree edge f splits T into two components. All graph edges between those components form its fundamental cut D_f, which is a bond. The fundamental cuts form a basis of the cut space. A tree edge f lies on Cₑ exactly when chord e crosses D_f.", formula: "f ∈ Cₑ ⇔ e ∈ D_f", visual: "fundamentalcut" },
        { name: "Dimensions from a spanning tree or forest", explanation: "A connected graph’s spanning tree has n−1 edges, supplying n−1 fundamental cuts; its remaining m−n+1 edges supply fundamental cycles. With c components, use a spanning forest to obtain the general formulas. The dimensions always add to m.", formula: "dim 𝓑=n−c;  dim 𝒞=m−n+c", visual: "basis" },
        { name: "Incidence matrix, boundary, kernel, and image", explanation: "The n×m incidence matrix B has a 1 when vertex i is an end of edge j. Over 𝔽₂, BF records vertices of odd degree in the selected edge set F; its kernel is the cycle space. Bᵀ sends a vertex set U to its crossing cut; its image is the cut space. In each component, the image of B contains precisely even-cardinality vertex sets.", formula: "Bᵢⱼ=1 ⇔ vᵢ∈eⱼ;  ker B=𝒞;  im Bᵀ=𝓑", visual: "incidence" },
        { name: "Adjacency matrix and counting walks", explanation: "The n×n adjacency matrix A has Aᵢⱼ=1 exactly when vᵢ and vⱼ are adjacent. Over 𝔽₂, AU selects vertices with an odd number of neighbours in U. With ordinary integer arithmetic, (Aᵏ)ᵢⱼ counts walks of length k from vᵢ to vⱼ: matrix multiplication sums over their intermediate vertices.", formula: "Aᵢⱼ=1 ⇔ vᵢvⱼ∈E;  (Aᵏ)ᵢⱼ = number of length-k walks", visual: "adjacency" },
        { name: "Degree matrix and unsigned incidence identity", explanation: "Let D be diagonal with vertex degrees. For the unsigned 0–1 incidence matrix, BBᵀ=A+D using real arithmetic: diagonal entries count edges at a vertex, and off-diagonal entries count shared incident edges. Reducing modulo 2 gives the corresponding 𝔽₂ identity. This is A+D, not the real Laplacian D−A.", formula: "BBᵀ = A+D", visual: "matrix" },
        { name: "Signed incidence, boundary, coboundary, and Laplacian", explanation: "The notes use real edge functions that reverse sign when an edge’s direction is reversed. Choose one orientation per edge as a basis: its signed incidence column is −1 at the initial vertex and +1 at the terminal vertex. This matrix represents the boundary ∂, and its transpose the dual coboundary. Their product is the orientation-independent Laplacian L=D−A.", formula: "B_signed B_signedᵀ = L = D−A", visual: "laplacian" }
      ],
      theorems: [
        { name: "Proposition 1.9.1 · three descriptions of cycle vectors", statement: "For F⊆E, membership in 𝒞(G), being an edge-disjoint union of cycles, and giving even degree at every vertex are equivalent.", insight: "Symmetric difference preserves even degrees. In a nonempty even-degree edge set, find a cycle, remove it, and repeat." },
        { name: "Proposition 1.9.2 · cuts form a space", statement: "The cuts together with ∅ form a vector subspace of ℰ(G), generated by the atomic cuts E(v).", insight: "Summing incident edge sets over one side cancels internal edges and keeps exactly the crossing edges." },
        { name: "Lemma 1.9.3 · bonds decompose cuts", statement: "Every cut is an edge-disjoint union of bonds.", insight: "If a nonempty cut is not minimal, subtract a smaller nonempty cut. In 𝔽₂ subtraction is addition, and the two smaller disjoint cuts can be decomposed inductively." },
        { name: "Theorem 1.9.4 · orthogonal spaces", statement: "𝒞(G)=𝓑(G)⊥ and 𝓑(G)=𝒞(G)⊥.", insight: "Cycles cross cuts evenly. If an edge set has an odd-degree vertex, the atomic cut at that vertex detects it, so being orthogonal to all cuts forces cycle-space membership." },
        { name: "Theorem 1.9.5 · spanning-tree bases", statement: "For connected G with n vertices and m edges, fundamental cuts form a basis of 𝓑(G), fundamental cycles form a basis of 𝒞(G), and their dimensions are n−1 and m−n+1.", insight: "Each fundamental cycle has one unique non-tree edge; each fundamental cut has one unique tree edge. These coordinates make independence and generation explicit." },
        { name: "Proposition 1.9.6 · matrix interpretations", statement: "Over 𝔽₂, ker B=𝒞(G) and im Bᵀ=𝓑(G).", insight: "B records the odd-degree boundary of an edge set, while Bᵀ records the edges crossing the boundary of a vertex set." },
        { name: "Proposition 1.9.7 · incidence and adjacency", statement: "For the unsigned incidence matrix B viewed over the reals, BBᵀ=A+D.", insight: "The (i,j) entry counts edges incident with both vertices. For distinct vertices this is adjacency; for i=j it is the degree." },
        { name: "Exercise extensions · generators and decomposition", statement: "Induced cycles, and even geodesic cycles, generate the cycle space. Every edge set E(G) admits a disjoint decomposition E(G)=C∪D with C∈𝒞(G) and D∈𝓑(G).", insight: "A chord or distance shortcut breaks a cycle into shorter cycle vectors. The disjoint decomposition is an existence result; orthogonality alone does not say the two subspaces span all edge vectors." }
      ],
      challenge: { question: "In 𝔽₂ edge-space addition, an edge appearing in both selected cycles…", options: ["appears twice in the result", "cancels out of the result", "makes the sum undefined"], answer: 1, explanation: "Its coordinate is 1+1=0. The sum is symmetric difference, so shared edges cancel." }
    },
    {
      id: "other", number: "1.10", title: "Other notions of graphs", kicker: "Broader models of connection",
      description: "Some problems need edges with direction, repeated edges, loops, or more than two ends. These variants retain much of the earlier language, but a few conventions must change.",
      concepts: [
        { name: "Hypergraphs", explanation: "A hypergraph has vertices and edges that are arbitrary nonempty subsets of vertices. A single hyperedge can connect three or more vertices, or just one. Simple graphs are the special case in which every edge has exactly two vertices. A hyperedge represents one joint relation, not necessarily all pairwise relations.", formula: "E ⊆ {U⊆V : U≠∅}", visual: "hypergraph" },
        { name: "Directed graphs and digraphs", explanation: "A directed graph gives each edge an initial vertex init(e) and a terminal vertex ter(e). An edge can be traversed in its prescribed direction. Diestel’s definition permits loops and several distinct edges with the same ends. Edge identities remain distinct even when their ends match.", formula: "init, ter : E → V", visual: "directed" },
        { name: "Multiple edges, parallel edges, and loops", explanation: "Multiple edges connect the same two vertices. In a digraph, parallel edges have the same direction as well; opposite-direction edges are distinct without being parallel. A loop has the same initial and terminal vertex. In a simple graph none of these possibilities occurs.", visual: "multigraph" },
        { name: "Orientations and oriented graphs", explanation: "An orientation chooses one direction for every edge of an undirected simple graph, preserving its vertices and edge identities. An oriented graph is therefore a digraph with no loops or multiple edges. A general digraph can have both x→y and y→x, while an orientation of a simple graph cannot.", visual: "orientation" },
        { name: "Strongly connected orientations (exercise extension)", explanation: "A digraph is strongly connected if a directed path leads from every vertex to every other. The chapter exercises connect this to undirected structure: a nontrivial graph has a strongly connected orientation exactly when it is 2-edge-connected, equivalently connected with no bridges. A bridge could only be crossed in its chosen direction.", visual: "strong" },
        { name: "Multigraphs and simple graphs", explanation: "A multigraph has distinct edge objects assigned either one end vertex or two. It permits loops and repeated edges, and can be viewed as a digraph with directions forgotten. In literature where multigraphs are the default, they are often called graphs and Diestel’s default graphs are called simple graphs.", visual: "multigraph" },
        { name: "Degree and cycles in multigraphs", explanation: "A loop contributes 2 to its vertex’s degree but makes that vertex just one neighbour, itself. Parallel edges count separately in degree. A loop is a cycle of length 1; two parallel edges form a cycle of length 2. Consequently degree is no longer simply the number of neighbours, while the handshaking identity still holds.", formula: "degree = nonloop incidences + 2·(number of loops)", visual: "loop" },
        { name: "Diestel’s multigraph connectivity convention", explanation: "For multigraph block structure, the ends of a loop or parallel edge are considered to separate that edge from the rest. Thus a loop’s vertex counts as a cutvertex unless that loop and vertex are an entire component. Under this convention a graph with a loop is never 2-connected, and a 3-connected multigraph is simple. This extends the simple-graph definitions with extra incidence conditions.", visual: "loop" },
        { name: "Edge contraction in multigraphs", explanation: "Contracting a nonloop e=xy merges x,y and deletes only e. Edges parallel to e become loops; other edges may become parallel. Contracting a loop has the same effect as deleting it. Unlike simple-graph contraction, repeated edges and newly formed loops can survive.", formula: "E(G/e)=E(G)∖{e}", visual: "contraction" },
        { name: "Partition contractions in multigraphs", explanation: "Contract each connected partition class to a vertex. Every edge between distinct classes survives, so several such edges become parallel. Diestel’s G/𝒫 normally discards edges within a class rather than keeping resulting loops. This partition convention therefore differs slightly from repeatedly contracting specific edges while retaining all surplus loops.", visual: "branchsets" },
        { name: "Suppressing degree-2 vertices", explanation: "Suppressing a degree-2 vertex deletes it and its two incident edges, then replaces them with an edge between its neighbours. If both neighbours are the same vertex, the replacement is a loop. If the degree-2 vertex carries only a loop, delete it without adding an edge. On an ordinary subdivided edge this reverses subdivision. In every case it preserves every other vertex’s degree.", visual: "suppress" }
      ],
      theorems: [
        { name: "Conventions travel with the model", statement: "In a multigraph, loops count twice toward degree and cycles may have length 1 or 2. An Euler tour still pairs incident edge uses, so the connected even-degree criterion continues to hold.", insight: "Count edge ends, rather than distinct neighbours. This is the version naturally suited to the original bridge problem." },
        { name: "Suppression is consistent", statement: "Suppressing a specified collection of degree-2 vertices produces the same multigraph regardless of their suppression order.", insight: "Each operation replaces a chain segment by one edge, while the degrees of other vertices stay unchanged. Parallel edges and loops are retained as needed." }
      ],
      challenge: { question: "How much does one loop add to its vertex’s degree?", options: ["0", "1", "2"], answer: 2, explanation: "Both ends of the loop are incident with the same vertex, so it contributes 2 to degree." }
    }
  ]

<script>
/* GraphMath: dependency-free algorithms for finite undirected graphs.
 * Graph: {nodes: [{id: string, x?: number, y?: number, ...}],
 *         edges: [{id: string, a: string, b: string, ...}]}.
 * IDs must be unique. Algorithms ignore edges whose endpoints are absent.
 * Most examples use simple graphs; traversal, degree, bridge and cycle
 * algorithms also handle loops and parallel edges. Inputs are never mutated.
 */
(function (global) {
  'use strict';

  function data(g) {
    const nodes = (g && g.nodes) || [];
    const nodeMap = new Map(nodes.map(n => [n.id, n]));
    const edges = ((g && g.edges) || []).filter(e => nodeMap.has(e.a) && nodeMap.has(e.b));
    const adj = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) {
      adj.get(e.a).push({ to: e.b, id: e.id });
      adj.get(e.b).push({ to: e.a, id: e.id });
    }
    return { nodes, nodeMap, edges, adj };
  }

  /** Returns { [nodeId]: neighborId[] }; loops occur twice. */
  function adjacency(g) {
    const d = data(g), result = Object.create(null);
    for (const n of d.nodes) result[n.id] = d.adj.get(n.id).map(e => e.to);
    return result;
  }

  /** Returns { [nodeId]: degree }; a loop contributes two to the degree. */
  function degrees(g) {
    const d = data(g), result = Object.create(null);
    for (const n of d.nodes) result[n.id] = d.adj.get(n.id).length;
    return result;
  }

  /** Returns node-ID arrays, one per connected component after deletion. */
  function components(g, removedNodes = [], removedEdges = []) {
    const d = data(g), omittedNodes = new Set(removedNodes), omittedEdges = new Set(removedEdges);
    const seen = new Set(), result = [];
    for (const n of d.nodes) {
      if (seen.has(n.id) || omittedNodes.has(n.id)) continue;
      const queue = [n.id], component = [];
      seen.add(n.id);
      for (let i = 0; i < queue.length; i++) {
        const v = queue[i];
        component.push(v);
        for (const e of d.adj.get(v)) {
          if (omittedEdges.has(e.id) || omittedNodes.has(e.to) || seen.has(e.to)) continue;
          seen.add(e.to); queue.push(e.to);
        }
      }
      result.push(component);
    }
    return result;
  }

  /** Returns a shortest path as node IDs, or [] if either endpoint is absent or unreachable. */
  function shortestPath(g, start, end) {
    const d = data(g);
    if (!d.nodeMap.has(start) || !d.nodeMap.has(end)) return [];
    const parent = new Map([[start, null]]), queue = [start];
    for (let i = 0; i < queue.length && !parent.has(end); i++) {
      for (const e of d.adj.get(queue[i])) {
        if (parent.has(e.to)) continue;
        parent.set(e.to, queue[i]); queue.push(e.to);
      }
    }
    if (!parent.has(end)) return [];
    const path = [];
    for (let v = end; v !== null; v = parent.get(v)) path.push(v);
    return path.reverse();
  }

  function separation(g) {
    const d = data(g), discovery = new Map(), low = new Map();
    const bridgeIds = new Set(), cutIds = new Set();
    let clock = 0;
    function visit(v, parentEdge) {
      discovery.set(v, ++clock); low.set(v, clock);
      let children = 0;
      for (const e of d.adj.get(v)) {
        if (e.id === parentEdge) continue;
        if (!discovery.has(e.to)) {
          children++; visit(e.to, e.id);
          low.set(v, Math.min(low.get(v), low.get(e.to)));
          if (low.get(e.to) > discovery.get(v)) bridgeIds.add(e.id);
          if (parentEdge !== undefined && low.get(e.to) >= discovery.get(v)) cutIds.add(v);
        } else {
          low.set(v, Math.min(low.get(v), discovery.get(e.to)));
        }
      }
      if (parentEdge === undefined && children > 1) cutIds.add(v);
    }
    for (const n of d.nodes) if (!discovery.has(n.id)) visit(n.id, undefined);
    return {
      bridges: d.edges.filter(e => bridgeIds.has(e.id)).map(e => e.id),
      cuts: d.nodes.filter(n => cutIds.has(n.id)).map(n => n.id)
    };
  }

  /** Returns IDs of edges whose deletion increases the number of components. */
  function bridges(g) { return separation(g).bridges; }

  /** Returns IDs of vertices whose deletion increases the number of components. */
  function cutVertices(g) { return separation(g).cuts; }

  /** Returns {ok, colors: {[nodeId]: 0|1}, conflict: null|{edgeId,a,b}}.
   * On failure colors is the partial BFS coloring, and conflict identifies an
   * edge with equally colored endpoints (including a loop).
   */
  function bipartition(g) {
    const d = data(g), colors = Object.create(null), seen = new Set();
    for (const n of d.nodes) {
      if (seen.has(n.id)) continue;
      const queue = [n.id]; colors[n.id] = 0; seen.add(n.id);
